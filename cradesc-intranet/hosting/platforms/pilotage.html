<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRADESC — Plateforme de pilotage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F0EB; --surface:#FFFFFF; --surface-2:#FBF8F4;
  --ink:#2A1D18; --ink-soft:#6B5A52; --ink-faint:#9C8C82;
  --acajou:#4A2E25; --acajou-d:#3A241D; --acajou-d2:#311E18;
  --taupe:#7A6962; --taupe-2:#A2948D;
  --parch:#EBE1D6; --parch-soft:#C9BCAF;
  --line:#E7DED5; --line-2:#EFE9E1;
  --green:#4E6B52; --green-bg:#E9F0E9; --green-line:#cfe0cf;
  --ocre:#9A6B22; --ocre-bg:#F6EDD9; --ocre-line:#ecdcbc;
  --oxblood:#9B3B2E; --oxblood-bg:#F6E5E0; --oxblood-line:#e8cfc9;
  --slate:#5E5A74; --slate-bg:#ECEAF1; --slate-line:#ddd9e6;
  --blue:#3a5a78; --blue-bg:#e8eef3; --blue-line:#cfdce6;
  --shadow:0 1px 2px rgba(42,29,24,.05),0 8px 24px rgba(42,29,24,.06);
  --shadow-lg:0 18px 50px rgba(42,29,24,.20);
  --r:12px; --r-s:9px;
  --sans:'Inter',system-ui,sans-serif; --serif:'Spectral',Georgia,serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.mono{font-family:var(--mono)} .faint{color:var(--ink-faint)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--parch-soft);border-radius:6px;border:2px solid var(--paper)}

/* ===== shell ===== */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--acajou-d);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
.sb-logo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.sb-logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.sb-brand b{font-family:var(--serif);font-size:17px;letter-spacing:.01em;display:block;line-height:1.1}
.sb-brand span{font-size:10.5px;color:var(--parch-soft);text-transform:uppercase;letter-spacing:.09em}
#nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.navit{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:9px;color:#d8c9bf;font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:.12s}
.navit:hover{background:rgba(255,255,255,.07);color:#fff}
.navit.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.navit svg{flex:none;opacity:.9}
.nav-count{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;font-size:11px;font-weight:600;border-radius:20px;padding:1px 8px;font-family:var(--mono)}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sb-foot .me-av{width:34px;height:34px;border-radius:50%;background:var(--taupe);display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;flex:none}
.sb-foot b{font-size:12.5px;display:block} .sb-foot span{font-size:10.5px;color:var(--parch-soft)}
.admin-badge{margin-left:auto;background:rgba(255,255,255,.12);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:5px;padding:3px 6px;color:#e8dcd2}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:18px;padding:16px 26px;background:rgba(244,240,235,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.pg-titles h1{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.15}
.pg-titles p{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.tb-spacer{flex:1}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:230px;color:var(--ink-faint)}
.tb-search input{border:none;outline:none;background:none;width:100%}
.btn-new{display:inline-flex;align-items:center;gap:7px;background:var(--acajou);color:#fff;font-weight:600;font-size:13px;border-radius:10px;padding:9px 15px;box-shadow:var(--shadow)}
.btn-new:hover{background:var(--acajou-d)}
.view-wrap{padding:24px 26px 60px;max-width:1380px;width:100%}

/* ===== pills / avatars ===== */
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill.slate{background:var(--slate-bg);color:var(--slate)} .pill.ocre{background:var(--ocre-bg);color:var(--ocre)}
.pill.green{background:var(--green-bg);color:var(--green)} .pill.oxblood{background:var(--oxblood-bg);color:var(--oxblood)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.ava{width:27px;height:27px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10.5px;font-weight:600;flex:none}
.ava.sm{width:22px;height:22px;font-size:9px}
.late-chip{font-size:9.5px;font-weight:700;background:var(--oxblood-bg);color:var(--oxblood);border-radius:5px;padding:1px 6px}

/* ===== KPI grids / panels ===== */
.kgrid8{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.kgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow)}
.kpi .kn{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1}
.kpi .kl{font-size:11.5px;color:var(--ink-soft);margin-top:5px}
.kpi.bad .kn{color:var(--oxblood)} .kpi.warn .kn{color:var(--ocre)}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-h{font-family:var(--serif);font-size:14.5px;font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.panel-b{padding:16px 18px}
.donut-row{display:flex;align-items:center;gap:24px}
.legend{display:flex;flex-direction:column;gap:8px;flex:1}
.li{display:flex;align-items:center;gap:9px;font-size:13px}.ld{width:11px;height:11px;border-radius:3px;flex:none}.ll{flex:1}.lv{font-weight:600;font-family:var(--mono)}
.bars{display:flex;flex-direction:column;gap:11px}
.barrow{display:flex;align-items:center;gap:11px;font-size:12.5px}
.bl{width:120px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.bartrack{flex:1;height:9px;background:var(--parch);border-radius:5px;overflow:hidden}.bartrack i{display:block;height:100%;border-radius:5px}
.bv{width:54px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);flex:none}
.up-list{display:flex;flex-direction:column;gap:4px}
.up-i{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:9px;cursor:pointer}.up-i:hover{background:var(--surface-2)}
.up-ic{font-size:18px;flex:none}.up-t{font-weight:600;font-size:13px}.up-s{font-size:11px;color:var(--ink-faint)}.up-m{flex:1;min-width:0}.up-t,.up-s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--surface-2);font-size:12.5px;cursor:pointer}
.alert.bad{background:var(--oxblood-bg)}.al-ic{flex:none}.al-s{font-size:11px;color:var(--ink-faint);margin-top:1px}
.gdot{flex:none}

/* ===== tree (portefeuille) ===== */
.port-hint{font-size:12.5px;color:var(--ink-faint);margin-bottom:14px}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.trow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.1s}
.trow:hover{background:var(--surface-2)}
.tchev{width:16px;display:grid;place-items:center;color:var(--ink-faint);transition:transform .15s;flex:none}.tchev.open{transform:rotate(90deg)}
.tdot{width:11px;height:11px;border-radius:50%;flex:none}.ticon{flex:none;color:var(--taupe);display:grid;place-items:center;font-size:14px}
.tname{font-weight:600;font-size:13.5px}.lvl-prog .tname{font-family:var(--serif);font-size:15px}
.tname.clk:hover{text-decoration:underline}.tname2{font-size:13px}.tname2.strike,.strike{text-decoration:line-through;color:var(--ink-faint)}
.tcode{font-family:var(--mono);font-size:10px;background:var(--parch);color:var(--acajou);border-radius:5px;padding:1px 6px}
.tmeta{font-size:11px;color:var(--ink-faint);margin-left:auto;white-space:nowrap}
.tbudget{font-size:12px;color:var(--ink-soft);width:64px;text-align:right;flex:none}
.tprog{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);font-family:var(--mono)}
.tprog-b{width:46px;height:6px;background:var(--parch);border-radius:4px;overflow:hidden}.tprog-b i{display:block;height:100%;background:var(--green)}
.lvl-proj>.trow{padding-left:40px;background:#fdfbf8}
.lvl-act>.trow{padding-left:66px}
.lvl-task>.trow{padding-left:92px;background:var(--surface-2)}
.lvl-task>.trow.ip{padding-left:66px}
.trow.leaf{cursor:pointer}
.tcheck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--parch-soft);display:grid;place-items:center;font-size:10px;color:#fff;flex:none}
.tcheck.done{background:var(--green);border-color:var(--green)}
.tname-meta{margin-left:auto}

/* ===== tasks board/list ===== */
.tasks-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--parch);border-radius:9px;padding:3px}
.seg button{padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tfilters{display:flex;gap:9px;margin-left:auto;flex-wrap:wrap}
.tfilters select,.srch{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surface);font-size:12.5px;color:var(--ink-soft)}
.srch{display:flex;align-items:center;gap:7px}.srch input{border:none;outline:none;background:none;width:130px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.bcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bcol-h{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line-2)}
.bcount{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.bcol-b{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.bcol-empty{text-align:center;color:var(--ink-faint);font-size:12px;padding:14px}
.tkcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:.12s}
.tkcard:hover{border-color:var(--parch-soft);transform:translateY(-1px)}
.tk-bc{font-size:10.5px;color:var(--ink-faint);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-title{font-weight:600;font-size:13px;line-height:1.35;margin-bottom:9px}
.tk-foot{display:flex;align-items:center;gap:7px}
.prio{font-size:9.5px;font-weight:700;border-radius:5px;padding:2px 7px;text-transform:uppercase;letter-spacing:.03em}
.prio.haute{background:var(--oxblood-bg);color:var(--oxblood)}.prio.moyenne{background:var(--ocre-bg);color:var(--ocre)}.prio.basse{background:var(--slate-bg);color:var(--slate)}
.tk-due{font-size:11px;color:var(--ink-soft);font-family:var(--mono)}.tk-foot .ava{margin-left:auto}
.ttable,.wl-table,.mat-table{width:100%;border-collapse:collapse;background:var(--surface)}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow)}
.ttable th,.wl-table th,.mat-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ttable td,.mat-table td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
.ttable tr{cursor:pointer}.ttable tbody tr:hover{background:var(--surface-2)}
.bc{font-size:11.5px;color:var(--ink-soft)}.bc-x{font-weight:600}

/* ===== calendar ===== */
.cal-top{display:flex;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.cal-month{font-family:var(--serif);font-size:19px;font-weight:600}
.gsync{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--surface)}
.gsync.on{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.cal-leg{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.cleg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft)}.cleg i{width:10px;height:10px;border-radius:3px}
.cl-seminaire{background:#4A2E25}.cl-conference{background:#9B3B2E}.cl-atelier{background:#9A6B22}.cl-mission{background:#5E5A74}.cl-formation{background:#3a5a78}.cl-etude{background:#4E6B52}.cl-reunion{background:#7A6962}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-dh{background:var(--surface-2);text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;padding:8px}
.cal-cell{background:var(--surface);min-height:112px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px}
.cal-cell.empty{background:var(--surface-2)}
.cal-cell.today{background:#fdf6ee;box-shadow:inset 0 0 0 2px var(--ocre)}
.cal-d{font-size:12px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.cal-now{font-size:8.5px;background:var(--ocre);color:#fff;border-radius:4px;padding:1px 5px;font-weight:700}
.cal-act{font-size:10px;font-weight:600;color:#fff;border-radius:5px;padding:2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-act.seminaire{background:#4A2E25}.cal-act.conference{background:#9B3B2E}.cal-act.atelier{background:#9A6B22}.cal-act.mission{background:#5E5A74}.cal-act.formation{background:#3a5a78}.cal-act.etude{background:#4E6B52}.cal-act.reunion{background:#7A6962}
.cal-task{font-size:10px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-dot{width:6px;height:6px;border-radius:50%;background:var(--taupe-2);flex:none}.cal-task.late{color:var(--oxblood)}.cal-task.late .ct-dot{background:var(--oxblood)}

/* ===== workload ===== */
.wl-legend{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.wl-k{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}.wl-k i{width:12px;height:12px;border-radius:3px}
.wl-table td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:center}
.wl-agent{display:flex;align-items:center;gap:10px;text-align:left!important}
.wl-agent b{font-size:13px;display:block}.wl-agent span{font-size:10.5px;color:var(--ink-faint)}
.wl-cell{position:relative}.wl-cell.indispo{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 5px,#f0ebe4 5px,#f0ebe4 10px)}
.wl-bar{width:38px;height:42px;background:var(--parch);border-radius:5px;margin:0 auto 4px;display:flex;align-items:flex-end;overflow:hidden}
.wl-bar i{width:100%;border-radius:0 0 5px 5px}
.wl-v{font-family:var(--mono);font-size:12px;font-weight:600}.wl-v span{color:var(--ink-faint);font-weight:400;font-size:10px}
.wl-flag{font-size:8.5px;color:var(--ink-faint);display:block;margin-top:2px}
.wl-tot{min-width:90px}.wl-totbar{width:64px;height:7px;background:var(--parch);border-radius:4px;margin:0 auto 4px;overflow:hidden}.wl-totbar i{display:block;height:100%}
.wl-note{font-size:11.5px;color:var(--ink-faint);margin-top:14px}

/* ===== resources ===== */
.res-top{display:flex;gap:13px;margin-bottom:18px;flex-wrap:wrap}
.res-kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow)}.res-kpi b{font-family:var(--serif);font-size:20px;color:var(--ink);margin-right:5px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.rc-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.rc-id{flex:1}.rc-id b{font-size:13.5px;display:block}.rc-id span{font-size:11px;color:var(--ink-faint)}
.rc-strip-l{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.rc-strip{display:flex;gap:3px;margin-bottom:13px}
.rs-day{flex:1;height:22px;border-radius:4px;background:var(--green-bg)}
.rs-day.on{background:var(--green-bg)}.rs-day.wk{background:var(--surface-2)}
.rs-day.off{background:var(--oxblood-bg)}.rs-day.off.mission{background:var(--ocre-bg)}.rs-day.off.formation{background:var(--blue-bg)}
.rc-next{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;padding:9px 0;border-top:1px solid var(--line-2)}.rc-ic{flex:none}
.rc-load{font-size:11.5px;color:var(--ink-faint)}.rc-load b{color:var(--ink-soft)}

/* ===== materiel ===== */
.mat-top{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.mat-chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px;font-size:12.5px;color:var(--ink-soft);font-weight:500}
.mat-chip b{font-family:var(--mono);margin-right:3px}
.mat-chip.on{border-color:var(--acajou);background:var(--acajou);color:#fff}
.mat-chip.on b{color:#fff}
.mini-act{font-size:11.5px;font-weight:600;color:var(--acajou);border:1px solid var(--line);border-radius:7px;padding:5px 11px}.mini-act:hover{background:var(--parch)}
.mat-val{font-size:13px;color:var(--ink-soft);margin-top:14px;text-align:right}

/* ===== budget ===== */
.bud-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}
.bud-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow)}
.bk-l{font-size:11.5px;color:var(--ink-faint)}.bk-n{font-size:18px;font-weight:600;margin-top:5px}.bk-s{font-size:11px;color:var(--ink-soft);margin-top:2px}
.bud-list{display:flex;flex-direction:column;gap:14px}
.bud-prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;box-shadow:var(--shadow)}
.bud-prog-h{display:flex;align-items:center;gap:10px;margin-bottom:11px}.bud-prog-h b{font-family:var(--serif);font-size:15px;flex:1}.bud-fig{font-size:13px;color:var(--ink-soft)}
.bud-bar{height:14px;background:var(--parch);border-radius:7px;overflow:hidden;position:relative;margin-bottom:8px}
.bud-bar i{position:absolute;left:0;top:0;height:100%;border-radius:7px}.bud-bar .eng{background:var(--ocre-line)}.bud-bar .cons{background:var(--ocre)}

.gadget:hover .g-rm,.gadget:hover .g-wd{opacity:1}.g-rm:hover{background:var(--oxblood-bg);color:var(--oxblood)}.g-wd:hover{background:var(--parch)}
.g-b{padding:16px 16px}

.g-table table{width:100%;border-collapse:collapse}.g-table th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}.g-table td{padding:8px 10px;border-bottom:1px solid var(--line-2);font-size:12.5px}.g-table tr{cursor:pointer}.g-table tbody tr:hover{background:var(--surface-2)}

.gadd:hover{background:var(--parch)}
.gadd .gp{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.gadget-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gp-opt{border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;text-align:left;background:var(--surface)}
.gp-opt:hover{border-color:var(--acajou);background:var(--surface-2)}
.gp-i{width:36px;height:36px;border-radius:9px;background:var(--parch);color:var(--acajou);display:grid;place-items:center;flex:none}

@media(max-width:1100px){.g-grid{grid-template-columns:repeat(2,1fr)}.gadget.w4{grid-column:span 2}.gadget-pick{grid-template-columns:1fr}.g-b .kgrid8{grid-template-columns:1fr 1fr}}

/* ===== revue de coordination ===== */
.revue-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:20px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}

.rev-grp{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:12px;color:var(--ink-faint)}
.rev-grp button{border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink-soft)}.rev-grp button.on{background:var(--acajou);color:#fff;border-color:var(--acajou)}
.revue-prog{text-align:right}.revue-prog .rp-n{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--oxblood)}.revue-prog .rp-l{font-size:11.5px;color:var(--ink-faint)}
.rev-empty{text-align:center;padding:50px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.rgroup-h{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line-2);font-family:var(--serif);font-size:14.5px;font-weight:600}
.rgroup-h .tdot{width:11px;height:11px;border-radius:50%}.rg-c{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.rrow{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-2)}.rrow:last-child{border-bottom:none}
.rrow.reviewed{background:var(--surface-2);opacity:.75}
.rr-st{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.rr-main{flex:1;min-width:0}.rr-title{font-weight:600;font-size:13.5px;cursor:pointer}.rr-title:hover{text-decoration:underline}
.rr-meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rr-key{font-family:var(--mono);font-size:11px;color:var(--acajou)}
.rr-obstacle{font-size:12px;color:#7a3326;background:var(--oxblood-bg);border:1px solid var(--oxblood-line);border-radius:8px;padding:7px 11px;margin-top:8px}
.rr-actions{display:flex;gap:7px;flex:none;align-items:center}
.btn-mini2{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.btn-mini2:hover{border-color:var(--acajou);color:var(--acajou)}
.btn-mini2.done{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.btn-mini2.val{background:var(--acajou);color:#fff;border-color:var(--acajou)}.btn-mini2.val:hover{background:var(--acajou-d);color:#fff}
.toval{font-size:10px;font-weight:700;color:var(--green);background:var(--green-bg);padding:2px 7px;border-radius:5px}
.nav-count.warn{background:var(--oxblood);color:#fff}

/* ===== vue d'ensemble — synthèse budgétaire ===== */
.bud-synth{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
.bs-head{display:flex;align-items:flex-end;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.bs-head h3{font-family:var(--serif);font-size:16px;font-weight:600}

.bs-filters{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.bs-filters select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surface);font-size:12.5px;color:var(--ink-soft)}
.bs-body{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:18px 20px}

/* ===== tableaux de bord — gestion ===== */
.dm-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.dm-h2{font-family:var(--serif);font-size:19px;font-weight:600}
.dm-p{font-size:13px;color:var(--ink-soft);margin-top:4px;max-width:560px}
.dm-head .btn-new{margin-left:auto;flex:none}
.dm-sec{font-family:var(--serif);font-size:15px;font-weight:600;margin:26px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dm-empty{font-size:13px;color:var(--ink-faint);padding:18px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r)}
.dash-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.dash-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 17px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:9px}
.dash-card:hover{transform:translateY(-2px);border-color:var(--parch-soft);box-shadow:var(--shadow-lg)}
.dc-top{display:flex;align-items:center;gap:9px}
.dc-name{font-family:var(--serif);font-size:15px;font-weight:600;flex:1}
.dc-right{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--taupe);background:var(--parch);border-radius:5px;padding:3px 8px}
.dc-right.edit{color:var(--green);background:var(--green-bg)}
.dc-scope{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft)}.dc-scope svg{color:var(--taupe);flex:none}
.dc-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);padding-top:9px;border-top:1px solid var(--line-2)}
.dc-actions{display:flex;gap:7px;padding-top:4px}
.dc-actions button{font-size:11.5px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line);border-radius:7px;padding:6px 11px}
.dc-actions button:hover{border-color:var(--acajou);color:var(--acajou)}
.dc-actions button.del:hover{border-color:var(--oxblood);color:var(--oxblood)}

/* ===== tableau de bord — barre ===== */
.db-bar{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.db-back{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line);border-radius:9px;padding:8px 13px;flex:none}.db-back:hover{border-color:var(--acajou);color:var(--acajou)}
.db-info{flex:1;min-width:200px}.db-info h2{font-family:var(--serif);font-size:18px;font-weight:600}
.db-meta{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap}
.db-chip{font-size:11px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;padding:3px 11px}
.db-chip.ro{color:var(--ocre);background:#fbf2e3;border-color:#e9d9bf}

/* ===== form périmètre / droits ===== */
.seg-radio{display:inline-flex;background:var(--parch);border-radius:9px;padding:3px}

.seg-radio button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ms-chips{display:flex;flex-wrap:wrap;gap:7px}
.ms-chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.ms-chip.on{border-color:var(--acajou);background:var(--acajou);color:#fff}

/* ===== budget — outil de pilotage ===== */
.bud-filter{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 15px;margin-bottom:16px;flex-wrap:wrap}
.bf-l{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}.bf-l svg{color:var(--taupe)}
.bud-filter select{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface);font-size:12.5px;color:var(--ink-soft)}
.bud-kpis6{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:16px}
.bud-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px}
.bud-kpi.alert{border-color:var(--oxblood-line);background:var(--oxblood-bg)}
.bk-l{font-size:11px;color:var(--ink-faint);margin-bottom:6px}
.bk-n{font-size:18px;font-weight:600}.bk-n.neg{color:var(--oxblood)}
.bk-bar{height:4px;border-radius:3px;background:var(--parch);margin:8px 0 5px;overflow:hidden}.bk-bar i{display:block;height:100%}.bk-bar i.warn{background:var(--ocre)}.bk-bar i.cons{background:var(--green)}
.bk-s{font-size:10.5px;color:var(--ink-faint)}
.bud-grid2{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.bud-table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.bt-head{display:flex;align-items:baseline;gap:12px;padding:15px 18px 12px}.bt-head h3{font-family:var(--serif);font-size:15px;font-weight:600}.bt-hint{font-size:11.5px;color:var(--ink-faint)}
.btable{padding:0 8px 10px}
.brow{display:grid;grid-template-columns:1fr 84px 84px 84px 84px 124px;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;border-bottom:1px solid var(--line-2)}
.brow.bthead{border-bottom:1.5px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700}
.brow.bthead .b-num,.brow.bthead .b-exc{text-align:right;padding-right:4px}
.brow.lvl0{font-weight:600}.brow.lvl0 .bn-t{font-family:var(--serif);font-size:14px}
.brow.lvl1 .b-name{padding-left:22px}.brow.lvl2 .b-name{padding-left:46px}
.brow.lvl2{font-size:12.5px;color:var(--ink-soft)}
.brow[data-bproj]{cursor:pointer}.brow[data-bproj]:hover{background:var(--surface-2)}
.b-name{display:flex;align-items:center;gap:8px;min-width:0}.bn-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-chev{display:inline-grid;place-items:center;width:18px;height:18px;color:var(--ink-faint);transition:transform .15s;cursor:pointer;flex:none}.b-chev.open{transform:rotate(90deg)}
.b-chevsp{width:18px;flex:none}
.b-num{text-align:right;font-size:12.5px;padding-right:4px}.b-num.eng{color:var(--ocre)}.b-num.cons{color:var(--green)}.b-num.neg{color:var(--oxblood)}
.b-exc{padding-left:6px}
.ex-cell{display:flex;align-items:center;gap:7px}
.ex-bar{flex:1;height:6px;border-radius:4px;background:var(--parch);overflow:hidden}.ex-bar i{display:block;height:100%}
.ex-bar i.ok{background:var(--green)}.ex-bar i.warn{background:var(--ocre)}.ex-bar i.over{background:var(--oxblood)}
.ex-pct{font-size:11px;font-family:var(--mono);width:34px;text-align:right}.ex-pct.ok{color:var(--green)}.ex-pct.warn{color:var(--ocre)}.ex-pct.over{color:var(--oxblood)}
.bud-side{display:flex;flex-direction:column;gap:14px}
.bud-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 17px}
.bud-card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:13px}
@media(max-width:1000px){.bud-kpis6{grid-template-columns:repeat(3,1fr)}.bud-grid2{grid-template-columns:1fr}}

/* ===== recherche multi-sélection + modes de droits ===== */
.seg-radio.sm{flex-wrap:wrap}.seg-radio.sm button{padding:6px 11px;font-size:11.5px}
.ms2{position:relative}
.ms2-box{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
.ms2-tags{display:flex;flex-wrap:wrap;gap:6px}
.ms2-tag{display:inline-flex;align-items:center;gap:6px;background:var(--acajou);color:#fff;border-radius:7px;padding:4px 5px 4px 10px;font-size:12px;font-weight:500}
.ms2-tag button{color:#fff;opacity:.85;font-size:14px;line-height:1;width:16px;height:16px;display:grid;place-items:center;border-radius:4px}.ms2-tag button:hover{background:rgba(255,255,255,.2)}
.ms2-ph{font-size:12px;color:var(--ink-faint);padding:2px 0}
.ms2-input{border:none;outline:none;background:transparent;font-size:13px;padding:3px 2px;width:100%}
.ms2-drop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);z-index:30;max-height:230px;overflow:auto;display:none}
.ms2-drop.open{display:block}
.ms2-opt{display:block;width:100%;text-align:left;padding:9px 13px;font-size:12.5px;color:var(--ink)}.ms2-opt:hover{background:var(--surface-2)}
.ms2-none{padding:10px 13px;font-size:12.5px;color:var(--ink-faint)}
.acc-info{font-size:12px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;line-height:1.45}

/* ===== profil / switcher utilisateur ===== */
.sb-foot{position:relative}
.me-id{flex:1;min-width:0}.me-id b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me-id span{font-size:11px;color:rgba(255,255,255,.55)}
.me-switch{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:rgba(255,255,255,.6)}.me-switch:hover{background:rgba(255,255,255,.1);color:#fff}
.me-menu{position:absolute;left:14px;right:14px;bottom:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);padding:6px;max-height:340px;overflow:auto;opacity:0;pointer-events:none;transform:translateY(6px);transition:.15s;z-index:50}
.me-menu.open{opacity:1;pointer-events:auto;transform:none}
.me-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.me-menu button:hover{background:var(--surface-2)}.me-menu button.on{background:var(--parch)}
.me-menu button b{display:block;font-size:12.5px;color:var(--ink)}.me-menu button span{font-size:11px;color:var(--ink-faint)}

/* ===== accueil personnalisé ===== */
.ov-hello{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello-h{font-family:var(--serif);font-size:24px;font-weight:600}
.hello-s{font-size:13px;color:var(--ink-soft);margin-top:3px}
.hello-chips{display:flex;gap:9px;margin-left:auto;flex-wrap:wrap}
.hchip{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 15px;font-size:12.5px;color:var(--ink-soft);box-shadow:var(--shadow)}.hchip b{font-family:var(--serif);font-size:17px;color:var(--ink);margin-right:5px}
.hchip.bad{border-color:var(--oxblood-line);background:var(--oxblood-bg)}.hchip.bad b{color:var(--oxblood)}
.hchip.warn{border-color:var(--ocre-line);background:#fbf2e3}.hchip.warn b{color:var(--ocre)}
.ov-me{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}

.ov-sec-t{font-family:var(--serif);font-size:15px;font-weight:600;margin:24px 0 13px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--ink-soft)}
@media(max-width:820px){.ov-me{grid-template-columns:1fr}}

/* ===== checklist tâche ===== */
.mini-prog2{height:5px;border-radius:3px;background:var(--parch);overflow:hidden;margin-bottom:10px}.mini-prog2 i{display:block;height:100%;background:var(--green)}
.pv.late{color:var(--oxblood)}

.th-sub{font-size:9px;font-weight:400;color:var(--ink-faint);text-transform:none;letter-spacing:0}
.wl-edit-hint{margin-left:auto;font-size:11px;color:var(--ink-faint);font-style:italic}
.wl-cap{text-align:center}

/* ===== ressources : indispos éditables ===== */

.rc-ind{display:flex;align-items:center;gap:8px;font-size:12px}

.rc-ind-t.conge{background:var(--slate-bg);color:var(--slate)}.rc-ind-t.mission{background:#fbf2e3;color:var(--ocre)}.rc-ind-t.formation{background:var(--blue-bg);color:var(--blue)}
.rc-ind-l{flex:1;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-ind-rm{color:var(--ink-faint);font-size:16px;line-height:1;width:18px}.rc-ind-rm:hover{color:var(--oxblood)}

/* ===== revue : contrôles ===== */
.rev-ctrl{display:flex;gap:18px;margin-top:11px;flex-wrap:wrap;align-items:center}
.rev-meeting,.rev-grp{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-faint)}
.rev-meeting select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink-soft);background:var(--surface);max-width:280px}
.rev-grp button{border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink-soft)}.rev-grp button.on{background:var(--acajou);color:#fff;border-color:var(--acajou)}
.rr-meta .pill{transform:scale(.92);transform-origin:left}

/* ===== budget : en-tête amélioré ===== */
.bud-hero{display:grid;grid-template-columns:1fr 360px;gap:16px;margin-bottom:16px}
.bh-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.bh-alloue{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.bh-l{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.bh-n{font-size:26px;font-weight:600}
.bh-stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--parch)}
.bh-stack i{display:block;height:100%}.s-dec{background:var(--green)}.s-eng{background:var(--ocre)}.s-dis{background:var(--parch-soft)}
.bh-leg{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft)}
.bh-leg span{display:flex;align-items:center;gap:6px}.bh-leg .le{width:11px;height:11px;border-radius:3px;display:inline-block}
.bh-kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.bh-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;display:flex;flex-direction:column;justify-content:center}
.bh-kpi.alert{border-color:var(--oxblood-line);background:var(--oxblood-bg)}
.bh-kpi .bk-n{font-size:20px;margin-top:4px}
@media(max-width:900px){.bud-hero{grid-template-columns:1fr}}

/* ===== Kanban amélioré ===== */
.kq-tog{border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface)}
.kq-tog:hover{border-color:var(--taupe-2)}
.kq-tog.on{background:var(--acajou);color:#fff;border-color:var(--acajou)}
/* carte : barre d'avancement + drag */
.kcard{cursor:grab;transition:box-shadow .12s,transform .12s,opacity .12s}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.45;transform:scale(.98)}
.kc-mini{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);margin-left:6px}
.kbcol-b.drag-over{background:var(--parch-bg,var(--surface-2));outline:2px dashed var(--acajou);outline-offset:-4px;border-radius:10px}
/* ajout rapide */
.kq-add{padding:4px 2px 2px}
.kq-add input{width:100%;border:1px dashed var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;background:transparent;color:var(--ink);outline:none;transition:.12s}
.kq-add input:focus{border-style:solid;border-color:var(--acajou);background:var(--surface)}
.kq-add input::placeholder{color:var(--ink-faint)}
/* couloirs (swimlanes) */
.kswim-wrap{display:flex;flex-direction:column;gap:14px}
.kswim{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px}
.kswim-h{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);padding:4px 6px 10px}
.kswim-h .bcount{margin-left:6px}
.kswim-h .ava{vertical-align:-2px}
.kboard.inlane{margin:0}
.kboard.inlane .kbcol{background:var(--surface)}
.kboard.inlane .kbcol-b{min-height:40px}

/* ===== rôles : badge profil + menu ===== */
.role-badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);border-radius:6px;padding:3px 7px;white-space:nowrap}
.mm-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;padding:6px 10px 8px}
.me-menu button{align-items:center}
.mm-id{flex:1;min-width:0}.mm-id b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mm-id span{font-size:11px;color:var(--ink-faint)}
.mm-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--parch);color:var(--acajou);border-radius:6px;padding:3px 7px;white-space:nowrap}
.me-menu button.on .mm-tag{background:var(--acajou);color:#fff}
/* carte kanban : info douce */
.kc-soft{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}

/* ===== lecture seule (rôles) ===== */
.ro-pill{background:var(--slate-bg);color:var(--slate);border:1px solid var(--slate-line)}
.ro-note{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-2);border-left:3px solid var(--taupe-2);border-radius:9px;padding:11px 13px;line-height:1.5}
.cl-item input:disabled{opacity:.6}

/* ===================== PLAN ===================== */
.plan-wrap{display:flex;flex-direction:column;gap:14px}
.plan-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-tabs>button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface)}
.plan-tabs>button:hover{border-color:var(--taupe-2)}
.plan-tabs>button.on{background:var(--acajou);color:#fff;border-color:var(--acajou)}
.plan-tabs>button.on svg{color:#fff}
.plan-zoom{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-faint)}
.plan-zoom button{border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.plan-zoom button.on{background:var(--parch);color:var(--acajou);border-color:var(--taupe-2)}

/* --- Gantt --- */
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gantt-scroll{overflow:auto;max-height:64vh}
.gantt-inner{position:relative}
.gantt-head{display:flex;position:sticky;top:0;z-index:6;background:var(--surface-2);border-bottom:1px solid var(--line)}
.g-corner{width:var(--labw);flex:none;position:sticky;left:0;z-index:7;background:var(--surface-2);padding:13px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);border-right:1px solid var(--line)}
.g-months{display:flex;flex:none}
.g-month{flex:none;text-align:center;font-size:11px;font-weight:600;color:var(--ink-soft);padding:13px 0;border-left:1px solid var(--line-2)}
.gantt-body{position:relative}
.g-row{display:flex;align-items:center;border-bottom:1px solid var(--line-2)}
.g-label{width:var(--labw);flex:none;position:sticky;left:0;z-index:5;background:var(--surface);display:flex;align-items:center;gap:7px;padding-right:10px;border-right:1px solid var(--line);height:100%;font-size:12.5px}
.g-label.d0{padding-left:12px;font-weight:600}.g-label.d1{padding-left:30px}.g-label.d2{padding-left:50px}.g-label.d3{padding-left:70px}
.g-label.d0 .g-lt{font-family:var(--serif);font-size:13.5px}
.g-caret{width:16px;height:16px;display:inline-grid;place-items:center;color:var(--ink-faint);cursor:pointer;flex:none;transition:transform .15s}.g-caret.open{transform:rotate(90deg)}
.g-caret-sp{width:16px;flex:none}
.g-dot{width:7px;height:7px;border-radius:50%;flex:none}
.g-lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.g-lt:hover{color:var(--acajou)}
.g-track{position:relative;flex:1;height:34px}
.g-bar{position:absolute;top:50%;transform:translateY(-50%);height:20px;border-radius:6px;display:flex;align-items:center;color:#fff;font-size:11px;overflow:hidden;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.g-bar.drag{cursor:grab}.g-bar.dragging{opacity:.8;cursor:grabbing;z-index:9}
.g-bar.programme{height:14px;border-radius:4px;opacity:.92}
.gb-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.26)}
.gb-l{position:relative;z-index:1;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.gb-h{position:absolute;top:0;bottom:0;width:7px;z-index:3;cursor:ew-resize}.gb-l-h{left:0}.gb-r-h{right:0}
.gb-flag{position:relative;z-index:2;margin-left:auto;padding:0 5px;font-size:11px}
.g-bar.bottleneck{box-shadow:0 0 0 1.5px var(--oxblood),0 1px 3px rgba(0,0,0,.2)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--oxblood);z-index:3;opacity:.55}
.g-deps{position:absolute;top:0;pointer-events:none;z-index:1}
.g-dep{fill:none;stroke:var(--taupe-2);stroke-width:1.4;stroke-dasharray:3 2}
.g-dep.crit{stroke:var(--oxblood);stroke-dasharray:none;stroke-width:1.6}
.g-dep-dot{fill:var(--taupe)}
.gantt-legend{display:flex;gap:16px;flex-wrap:wrap;padding:11px 16px;font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--line)}
.gantt-legend span{display:flex;align-items:center;gap:6px}.gantt-legend i{width:12px;height:9px;border-radius:2px;display:inline-block}
.gl-dep{color:var(--taupe)}.gl-today{color:var(--oxblood)}

/* --- Liste --- */
.plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pl-head,.pl-row{display:grid;grid-template-columns:minmax(280px,2fr) 1.1fr .7fr .7fr .9fr .9fr 1.3fr;align-items:center;gap:8px;padding:9px 16px}
.pl-head{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700}
.pl-row{border-bottom:1px solid var(--line-2);font-size:12.5px}
.pl-row.k-programme{background:var(--surface-2);font-weight:600}
.pl-row.k-programme .pl-t{font-family:var(--serif);font-size:14px}
.plc-name{display:flex;align-items:center;gap:7px;min-width:0}
.plc-name.d1{padding-left:18px}.plc-name.d2{padding-left:38px}.plc-name.d3{padding-left:58px}
.pl-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.pl-t:hover{color:var(--acajou)}
.pl-sm{color:var(--ink-soft)}.pl-sm.late{color:var(--oxblood);font-weight:600}
.pl-prog{display:flex;align-items:center;gap:7px}.pl-pbar{flex:1;height:5px;border-radius:3px;background:var(--parch);overflow:hidden}.pl-pbar i{display:block;height:100%;background:var(--green)}.pl-prog span{font-size:11px;font-family:var(--mono);color:var(--ink-faint);width:30px}
.pl-ratt{display:flex;align-items:center;gap:6px;min-width:0}
.pl-sel{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:11.5px;color:var(--ink-soft);background:var(--surface);max-width:100%}
.pl-dep{font-size:11px;color:var(--ocre);white-space:nowrap}

/* --- Capacité --- */
.cap-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cap-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.ck-l{font-size:11px;color:var(--ink-faint);margin-bottom:5px}.ck-n{font-size:22px;font-weight:600}.ck-s{font-size:11px;color:var(--ink-faint);margin-top:3px}
.cap-weekbars{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 18px}
.cwb-h{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:14px}
.cwb-grid{display:flex;gap:14px;align-items:flex-end}
.cwb-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.cwb-bar{position:relative;width:100%;max-width:60px;height:90px;background:var(--parch);border-radius:7px;display:flex;align-items:flex-end;overflow:hidden}
.cwb-bar i{width:100%;border-radius:0 0 7px 7px}
.cwb-over{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:#fff}
.cwb-l{font-size:11px;color:var(--ink-soft)}.cwb-v{font-size:11px;color:var(--ink-faint)}
.cap-table{width:100%;border-collapse:collapse;background:var(--surface)}
.cap-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;padding:11px 8px;border-bottom:1px solid var(--line);text-align:center}
.cap-table th:first-child{text-align:left;padding-left:16px}
.cap-table td{padding:9px 8px;border-bottom:1px solid var(--line-2);text-align:center}
.cap-cell.indispo{background:repeating-linear-gradient(45deg,transparent,transparent 4px,var(--slate-bg) 4px,var(--slate-bg) 8px)}
.cap-mini{width:22px;height:34px;margin:0 auto;background:var(--parch);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}.cap-mini i{width:100%}
.cap-v{display:block;font-size:10px;font-family:var(--mono);color:var(--ink-faint);margin-top:2px}
.cap-vel{white-space:nowrap}.cv-done{display:inline-block;font-size:12px;font-weight:700;color:var(--green);margin-right:8px}.cv-open{font-size:11px;color:var(--ink-faint)}
@media(max-width:1000px){.cap-summary{grid-template-columns:1fr}}

/* dépendances éditables (fiche tâche) */
.rel-rm{margin-left:auto;color:var(--ink-faint);font-size:15px;line-height:1;width:18px}.rel-rm:hover{color:var(--oxblood)}
.dep-add{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.dep-add select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--ink-soft);background:var(--surface)}
.dep-add #depTask{flex:1;min-width:140px}
/* capacité par équipe */
.cwb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cwb-head .cwb-h{margin-bottom:0}
.cap-grp{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-faint)}
.cap-grp button{border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.cap-grp button.on{background:var(--acajou);color:#fff;border-color:var(--acajou)}
.cap-team td{background:var(--surface-2);border-top:1.5px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px}
.cap-team td:first-child{text-align:left;padding-left:16px}
.cap-team .ct-n{font-size:11px;color:var(--ink-faint);font-weight:400;margin-left:4px}
.cap-tcell .ct-cap{color:var(--ink-faint);font-size:10px}

/* ===== navigation par sections ===== */
.nav-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.32);padding:16px 14px 6px}

/* ===== centre d'alertes ===== */
.tb-alert{position:relative}
.tb-bell{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft);border:1px solid var(--line);background:var(--surface)}
.tb-bell:hover{border-color:var(--taupe-2);color:var(--acajou)}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;font-size:10px;font-weight:700;color:#fff;display:none;align-items:center;justify-content:center;padding:0 4px}
.bell-badge.high{display:flex;background:var(--oxblood)}
.bell-badge.med{display:flex;background:var(--ocre)}
.alert-panel{position:absolute;top:calc(100% + 8px);right:0;width:380px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:60;opacity:0;pointer-events:none;transform:translateY(-6px);transition:.15s}
.alert-panel.open{opacity:1;pointer-events:auto;transform:none}
.ap-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.ap-h b{font-family:var(--serif);font-size:15px}.ap-h span{font-size:11.5px;color:var(--ink-faint)}
.ap-body{padding:6px}
.ap-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 11px;border-radius:9px;border-left:3px solid transparent}
.ap-item:hover{background:var(--surface-2)}
.ap-item.high{border-left-color:var(--oxblood)}.ap-item.med{border-left-color:var(--ocre)}.ap-item.low{border-left-color:var(--taupe-2)}
.ap-ic{font-size:16px;width:22px;text-align:center;flex:none}
.ap-m{flex:1;min-width:0}
.ap-t{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-s{font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ap-cat{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);background:var(--parch);border-radius:5px;padding:3px 6px;flex:none}
.ap-empty{text-align:center;padding:34px 16px;color:var(--ink-soft);font-size:13px;line-height:1.7}

/* menu profil : actions */
.mm-sep{height:1px;background:var(--line);margin:6px 4px}
.mm-act{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-soft);text-align:left}
.mm-act:hover{background:var(--surface-2)}.mm-act.danger{color:var(--oxblood)}.mm-act.danger:hover{background:var(--oxblood-bg)}
.mm-ico{width:18px;text-align:center}
/* digest + préférences d'alertes */
.ap-digest{font-size:11px;color:var(--ink-faint);margin-top:2px}
.ap-gear{font-size:15px;color:var(--ink-faint);width:28px;height:28px;border-radius:7px}.ap-gear:hover{background:var(--surface-2);color:var(--acajou)}
.ap-prefs{display:none;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ap-prefs.open{display:flex}
.ap-pref{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);cursor:pointer}
/* journal d'audit */
.jrnl{display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow:auto}
.jrnl-i{display:flex;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line-2)}
.jrnl-dot{width:8px;height:8px;border-radius:50%;background:var(--taupe-2);margin-top:5px;flex:none}
.jrnl-m{flex:1;min-width:0}
.jrnl-a{font-size:13px;color:var(--ink)}.jrnl-act{color:var(--ink-soft)}
.jrnl-tg{font-family:var(--mono);font-size:11.5px;color:var(--acajou);background:var(--parch-bg,var(--surface-2));padding:1px 6px;border-radius:5px}
.jrnl-d{font-size:11px;color:var(--ink-faint);margin-top:2px}

/* boutons export */
.exp-btn{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--surface)}
.exp-btn:hover{border-color:var(--taupe-2);color:var(--acajou)}
.bf-exports{display:flex;gap:7px;margin-left:auto}
.plan-zoom .exp-btn{margin-left:0}

/* hamburger (caché en desktop) */
.hamburger{display:none;width:38px;height:38px;border-radius:10px;align-items:center;justify-content:center;color:var(--ink-soft);border:1px solid var(--line);background:var(--surface);margin-right:4px}
.nav-scrim{position:fixed;inset:0;background:rgba(40,28,22,.4);z-index:39;opacity:0;pointer-events:none;transition:.2s}
.nav-scrim.open{opacity:1;pointer-events:auto}

/* ===== responsive mobile ===== */
@media(max-width:860px){
  .ov-me,.ov-grid,.bud-grid2,.cap-summary,.bs-body{grid-template-columns:1fr!important}
  .kgrid8{grid-template-columns:repeat(2,1fr)!important}
  .bud-kpis6{grid-template-columns:repeat(2,1fr)!important}
  .bud-hero{grid-template-columns:1fr!important}
}
@media(max-width:760px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:40;transform:translateX(-100%);transition:transform .22s;box-shadow:2px 0 16px rgba(0,0,0,.2)}
  .sidebar.mobile-open{transform:none}
  .sb-brand b,.sb-brand span,.navit span,.nav-count,.sb-foot .me-id,.role-badge{display:revert!important}
  .navit{justify-content:flex-start!important}
  .main{margin-left:0!important;width:100%}
  .shell{display:block}
  .hamburger{display:inline-flex}
  .topbar{flex-wrap:wrap;gap:8px;padding:12px 16px}
  .pg-titles h1{font-size:18px}
  .tb-search{order:5;width:100%;flex:1 1 100%}
  .tb-spacer{display:none}
  .alert-panel{position:fixed;left:8px;right:8px;top:64px;width:auto}

/* ===== impression ===== */

/* santé (fiches) + activité enrichie */
.health-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px 3px 8px;border-radius:20px}
.health-dot span{width:7px;height:7px;border-radius:50%}
.health-dot.green{background:var(--green-bg);color:var(--green)}.health-dot.green span{background:var(--green)}
.health-dot.ocre{background:#fbf2e3;color:var(--ocre)}.health-dot.ocre span{background:var(--ocre)}
.health-dot.oxblood{background:var(--oxblood-bg);color:var(--oxblood)}.health-dot.oxblood span{background:var(--oxblood)}
.members2{display:flex;flex-wrap:wrap;gap:8px}
.mem2{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;padding:4px 11px 4px 5px;font-size:12px}
.reul{display:flex;flex-direction:column;gap:6px}
.reu-i{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px}

/* bouton agrandir dans le drawer */
.dw-expand{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-faint);margin-left:auto}
.dw-expand:hover{background:var(--surface-2);color:var(--acajou)}
.dw-bar .dw-x{margin-left:6px}
.dw-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

/* ===== vue plein écran d'une tâche ===== */
.taskfull{position:fixed;inset:0;z-index:80;background:var(--paper);opacity:0;pointer-events:none;transform:scale(.985);transition:opacity .2s,transform .2s;overflow:hidden}
.taskfull.open{opacity:1;pointer-events:auto;transform:none}
.tf-inner{height:100%;display:flex;flex-direction:column}
.tf-topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--surface)}
.tf-bc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;flex:1}
.tf-actions{display:flex;align-items:center;gap:6px}
.tf-reduce,.tf-close{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft);border:1px solid var(--line);background:var(--surface)}
.tf-reduce:hover,.tf-close:hover{border-color:var(--taupe-2);color:var(--acajou)}
.tf-scroll{flex:1;overflow:auto}
.tf-wrap{max-width:1160px;margin:0 auto;padding:30px 26px 60px}
.tf-head{margin-bottom:22px}
.tf-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tf-title{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.2}
.tf-grid{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
.tf-main{display:flex;flex-direction:column;gap:16px}
.tf-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
.tf-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.tf-card .sec-h{margin-bottom:12px}
.tf-card .descbox,.tf-card .obsbox{font-size:14px}
.tf-card .props .prop{padding:11px 0}
@media(max-width:880px){.tf-grid{grid-template-columns:1fr}.tf-side{position:static}.tf-title{font-size:24px}.tf-wrap{padding:22px 16px 50px}.tf-topbar{padding:12px 16px}}

/* ===== champs éditables des fiches plein écran ===== */
.tf-title-in{font-family:var(--serif);font-size:30px;font-weight:600;border:none;border-bottom:2px solid transparent;background:transparent;width:100%;color:var(--ink);padding:2px 0;letter-spacing:-.01em}
.tf-title-in:hover{border-bottom-color:var(--line)}
.tf-title-in:focus{outline:none;border-bottom-color:var(--acajou)}
.ef-list{display:flex;flex-direction:column}
.ef-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.ef-row:last-child{border-bottom:none}
.ef-k{font-size:12.5px;color:var(--ink-soft);width:118px;flex:none}
.ef-v{flex:1;min-width:0}
.ef-in,.ef-sel{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13.5px;background:var(--surface);color:var(--ink)}
.ef-in.mono{font-family:var(--mono)}
.ef-in:focus,.ef-sel:focus,.ef-area:focus{outline:none;border-color:var(--acajou);box-shadow:0 0 0 3px var(--parch)}
.ef-area{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:var(--sans);resize:vertical;background:var(--surface);color:var(--ink);line-height:1.55;min-height:74px}
.ef-ro{font-size:13.5px;color:var(--ink)}
.ef-budget{display:flex;flex-direction:column;gap:10px}
.ef-solde{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.ef-solde .bad{color:var(--oxblood)}
.tf-card .ik-v.bad{color:var(--oxblood)}

/* ===== Fiches plein écran — design revu + édition au crayon ===== */
.tf-subt{font-size:13px;color:var(--ink-faint);margin-top:8px}
.tf-titlewrap{display:flex;align-items:center;gap:10px}
.tf-title-in{font-family:var(--serif);font-size:28px;font-weight:600;border:none;border-bottom:2px solid var(--acajou);background:transparent;color:var(--ink);padding:2px 0;flex:1;min-width:0;letter-spacing:-.01em}
.tf-title-in:focus{outline:none}
.tf-tpen{opacity:.45;transition:.12s}
.tf-titlewrap:hover .tf-tpen{opacity:1}
.tf-card .fc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:14px}
.tf-card .fc-sub{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--taupe)}
.fld-list{display:flex;flex-direction:column}
.fld{display:flex;align-items:center;gap:12px;padding:9px 8px;margin:0 -8px;border-radius:9px;min-height:40px;position:relative;transition:background .12s}
.fld:not(:last-child){border-bottom:1px solid var(--line-2)}
.fld:hover{background:var(--surface-2)}
.fld-k{font-size:12.5px;color:var(--ink-soft);width:130px;flex:none}
.fld-v{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.fld-disp{flex:1;min-width:0;font-size:13.5px;color:var(--ink);line-height:1.5;word-break:break-word}
.faintv{color:var(--ink-faint)}
.fld-pen{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;color:var(--taupe-2);flex:none;opacity:.45;border:1px solid transparent;transition:.12s}
.fld:hover .fld-pen{opacity:1;border-color:var(--line)}
.fld-pen:hover{background:var(--parch);color:var(--acajou)}
.fld-big{flex-direction:column;align-items:stretch;gap:7px}
.fld-big .fld-k{width:auto}
.fld-big .fld-v{align-items:flex-start}
.fld-big .fld-disp{white-space:pre-wrap}
.fld.editing{background:var(--surface-2)}
.fld.editing .fld-pen{display:none}
.fld-editor{flex:1;min-width:0}
.fld-input{width:100%;border:1px solid var(--acajou);border-radius:9px;padding:8px 11px;font-size:13.5px;font-family:var(--sans);background:var(--surface);color:var(--ink);box-shadow:0 0 0 3px var(--parch)}
.fld-input.mono{font-family:var(--mono)}
.fld-input:focus{outline:none}
textarea.fld-input{resize:vertical;line-height:1.55;min-height:76px}
.fld-acts{display:flex;gap:5px;flex:none}
.fld-ok,.fld-cancel{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.fld-ok{background:var(--green);color:#fff}
.fld-ok:hover{filter:brightness(1.06)}
.fld-cancel{background:var(--surface);border:1px solid var(--line);color:var(--ink-soft)}
.fld-cancel:hover{border-color:var(--taupe-2);color:var(--oxblood)}
.ef-solde{font-size:12.5px;color:var(--ink-soft);margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.ef-solde .bad{color:var(--oxblood)}

/* ===== Fiches plein écran — design affiné ===== */
.tf-inner{position:relative}
.tf-accent{position:absolute;top:0;left:0;right:0;height:4px;z-index:3}
.tf-wrap{padding-top:34px}
.tf-head{padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--line-2)}
.tf-title{font-size:31px;letter-spacing:-.015em}
.tf-grid{gap:24px}
.tf-card{border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(74,46,37,.04),0 4px 16px rgba(74,46,37,.05)}
.tf-card+.tf-card,.tf-main>.tf-card+.tf-card{margin-top:0}
.tf-main,.tf-side{gap:18px}
.tf-card .sec-h,.tf-card .fc-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tf-card .sec-h::before,.tf-card .fc-h>span:first-child::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--parch-2);display:inline-block;margin-right:2px}
.tf-card .fc-h{justify-content:space-between}
.tf-card .fc-h>span:first-child{display:flex;align-items:center;gap:8px}
/* indice d'édition : la valeur est cliquable */
.fld-disp.editable{cursor:text;border-radius:6px;transition:.12s;padding:1px 4px;margin:-1px -4px}
.fld-disp.editable:hover{background:var(--parch);color:var(--acajou)}
.fld:hover{background:var(--surface-2)}
.fld-pen:hover{background:var(--parch);color:var(--acajou);border-color:var(--parch-2)!important}
.tf-titlewrap .tf-tpen:hover{background:var(--parch);color:var(--acajou)}

/* ===== Revue renforcée : sous-onglets, réunions, décisions, risques ===== */
.rev-subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.rev-tab{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:none;background:none;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.rev-tab:hover{color:var(--ink)}
.rev-tab.on{color:var(--acajou);border-bottom-color:var(--acajou);font-weight:600}
.rev-tc{background:var(--parch);color:var(--ink-soft);border-radius:999px;font-size:11px;font-weight:600;padding:1px 7px;min-width:18px;text-align:center}
.rev-tc.warn{background:var(--oxblood);color:#fff}
.rev-secthead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.rev-secthead h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.rev-secthead p{margin:0;color:var(--ink-soft);font-size:13px;max-width:62ch}
.btn-primary2{background:var(--acajou);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-primary2:hover{background:#3a241d}
.rev-lbl{font-family:var(--serif);font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:4px 2px 11px}
.rev-lien{display:inline-block;background:var(--parch);color:var(--ink-soft);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:500}
/* réunions */
.reu-card{display:flex;align-items:center;gap:15px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:10px;cursor:pointer;transition:.12s}
.reu-card:hover{border-color:var(--taupe-2);box-shadow:0 2px 10px rgba(74,46,37,.06);transform:translateY(-1px)}
.reu-date{width:50px;height:50px;border-radius:11px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;text-align:center;flex-shrink:0;line-height:1}
.reu-date b{font-family:var(--serif);font-size:19px;color:var(--acajou)}.reu-date span{font-size:10px;color:var(--ink-faint);text-transform:uppercase}
.reu-m{flex:1;min-width:0}.reu-t{font-family:var(--serif);font-size:15px;font-weight:600}.reu-s{font-size:12px;color:var(--ink-faint);margin:2px 0 7px}
.reu-part{display:flex}.reu-part .ava{margin-right:-6px;border:2px solid var(--surface)}
.reu-more{width:22px;height:22px;border-radius:50%;background:var(--parch);color:var(--ink-soft);font-size:10px;display:grid;place-items:center;border:2px solid var(--surface);font-weight:600}
.reu-r{text-align:right;flex-shrink:0}.reu-cnt{font-size:11px;color:var(--ink-faint);margin-top:5px}
/* drawer sections génériques */
.dwh{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:4px}
.dwh-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dw-x{margin-left:auto;background:none;border:none;font-size:16px;color:var(--ink-faint);cursor:pointer}
.dwh-t{font-family:var(--serif);font-size:19px;margin:0 0 3px}.dwh-s{font-size:12.5px;color:var(--ink-soft)}
.dw-sec{padding:14px 0;border-bottom:1px solid var(--line-2,rgba(0,0,0,.05))}
.dw-sh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:9px}
.dw-parts{display:flex;flex-wrap:wrap;gap:7px}.dw-part{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 4px;font-size:12px}
.dw-odj{margin:0;padding-left:20px}.dw-odj li{font-size:13px;color:var(--ink-soft);margin-bottom:5px}
.dw-cr{font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.dw-faint{color:var(--ink-faint);font-size:12.5px;font-style:italic}
.dw-mini{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2,rgba(0,0,0,.04))}
.dw-mini:last-child{border:none}.dw-mini-t{flex:1;font-size:13px;min-width:0}
.dw-kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px}.dw-kv span{color:var(--ink-faint)}
.dw-note{margin-top:8px;font-size:13px;color:var(--ink-soft);background:var(--paper);border-radius:8px;padding:9px 11px}
.seg-st{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg-st button{border:none;background:var(--surface);padding:7px 12px;font-size:12px;color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line)}
.seg-st button:last-child{border-right:none}.seg-st button.on{background:var(--acajou);color:#fff;font-weight:600}
.seg-st button:disabled{opacity:.5;cursor:default}
.seg-st.sm button{padding:5px 9px;font-size:11px}
/* décisions */
.dec-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.dec-row:hover{background:var(--paper)}
.dec-ic{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dec-ic.ocre{background:var(--ocre)}.dec-ic.blue{background:var(--blue)}.dec-ic.green{background:var(--green)}
.dec-m{flex:1;min-width:0}.dec-t{font-weight:600;font-size:13.5px}.dec-s{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.late-chip{background:var(--oxblood);color:#fff;border-radius:5px;padding:0 5px;font-size:10px;font-weight:600}
/* risques */
.risk-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.risk-row.done{opacity:.55}
.risk-grav{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.g-haute{background:var(--oxblood)}.g-moyenne{background:var(--ocre)}.g-basse{background:var(--slate,#5E5A74)}
.risk-m{flex:1;min-width:0}.risk-t{font-weight:600;font-size:13.5px}.risk-s{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
/* modales : chips participants + lignes ODJ */
.chips-pick{display:flex;flex-wrap:wrap;gap:6px}
.chip-pick{font-size:12px;padding:5px 10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;color:var(--ink-soft)}
.chip-pick.on{background:var(--acajou);color:#fff;border-color:var(--acajou)}
.lrow{display:grid;grid-template-columns:1fr 30px;gap:6px;margin-bottom:6px}
.lrow input{width:100%}.lr-x{border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;color:var(--ink-faint)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

</style>

function scopeLabel(scope){if(!scope||scope.mode==='all')return 'Tout le portefeuille';

  if(scope.projs&&scope.projs.length)parts.push(scope.projs.length+' projet'+(scope.projs.length>1?'s':''));
  return parts.join(' · ')||'Périmètre vide';}
function membersOfScope(scope){const S=scopeSets(scope);const set=new Set();
  S.progs.forEach(p=>(p.membres||[]).forEach(m=>set.add(m.agentId)));
  S.projs.forEach(p=>(p.membres||[]).forEach(m=>set.add(m.agentId)));
  return set;}
function dAccess(d){return d.access||{read:{mode:'private',users:[]},write:{mode:'owner',users:[]}};}
function canEdit(d,ag){const w=dAccess(d).write;if(d.owner===ag)return true;
  if(w.mode==='everyone')return true;if(w.mode==='members')return membersOfScope(d.scope).has(ag);if(w.mode==='users')return (w.users||[]).includes(ag);return false;}
function canView(d,ag){if(d.owner===ag||canEdit(d,ag))return true;const r=dAccess(d).read;
  if(r.mode==='everyone')return true;if(r.mode==='members')return membersOfScope(d.scope).has(ag);if(r.mode==='users')return (r.users||[]).includes(ag);return false;}
const ACC_LABEL={everyone:'Tout le monde',members:'Membres du périmètre',users:'Utilisateurs choisis',private:'Privé',owner:'Vous uniquement'};
function shareLabel(d){const r=dAccess(d).read;
  if(r.mode==='everyone')return 'Visible par tous';
  if(r.mode==='members')return 'Membres du périmètre';
  if(r.mode==='users'){const n=(r.users||[]).length;return n?`Partagé avec ${n} personne${n>1?'s':''}`:'Privé';}
  return 'Privé';}

/* ---- gadgets ---- */
function gKpis(S){
  const openT=S.tasks.filter(t=>t.status!=='done'),lateT=S.tasks.filter(isLate);
  const upcoming=S.acts.filter(a=>a.start>=TODAY);
  const occ=Math.round(AGENTS.reduce((s,a)=>s+Math.min(allocAgentWeek(a.id,WEEKS[2])/a.cap,1.3),0)/AGENTS.length*100);
  const budTot=S.progs.reduce((s,p)=>s+p.budget,0)||1,budCons=S.progs.reduce((s,p)=>s+progConso(p.id),0);
  const matService=MATERIELS.filter(m=>m.statut!=='disponible').length;
  const k=[['Programmes',S.progs.length,''],['Projets actifs',S.projs.filter(p=>p.status==='cours').length,''],
    ['Activités à venir',upcoming.length,''],['Tâches ouvertes',openT.length,''],
    ['Tâches en retard',lateT.length,lateT.length?'bad':'']];
  if(canSeeModule('workload'))k.push(['Taux d\'occupation',occ+'%',occ>90?'warn':'']);
  if(canSeeBudget())k.push(['Budget consommé',Math.round(budCons/budTot*100)+'%','']);
  k.push(['Matériel mobilisé',matService+'/'+MATERIELS.length,'']);
  return k;
}
function donutBlock(segs){return `<div class="donut-row">${donut(segs)}<div class="legend">${segs.map(s=>`<div class="li"><span class="ld" style="background:${s.c}"></span><span class="ll">${s.l}</span><span class="lv">${s.v}</span></div>`).join('')}</div></div>`;}
function gadgetBody(type,scope){const S=scopeSets(scope);
  if((type==='bar_budget'||type==='kpi_budget')&&!canSeeBudget())return '<div class="g-empty">Budget — accès non autorisé pour votre rôle.</div>';
  if(type==='bar_charge'&&!canSeeModule('workload'))return '<div class="g-empty">Plan de charge — accès non autorisé pour votre rôle.</div>';
  if(type==='kpi')return `<div class="kgrid8 g-kpi">${gKpis(S).map(([l,v,c])=>`<div class="kpi ${c}"><div class="kn">${v}</div><div class="kl">${l}</div></div>`).join('')}</div>`;
  if(type==='donut_taches'){const sc={todo:'#A2948D',doing:'#9A6B22',review:'#3a5a78',done:'#4E6B52'};const c={};S.tasks.forEach(t=>c[t.status]=(c[t.status]||0)+1);
    const segs=Object.keys(TASK_ST).filter(k=>c[k]).map(k=>({v:c[k],c:sc[k],l:TASK_ST[k][0]}));return segs.length?donutBlock(segs):'<div class="g-empty">Aucune tâche.</div>';}
  if(type==='donut_projets'){const sc={planifie:'#A2948D',cours:'#9A6B22',suspendu:'#9B3B2E',termine:'#4E6B52'};const c={};S.projs.forEach(p=>c[p.status]=(c[p.status]||0)+1);
    const segs=Object.keys(PROJ_ST).filter(k=>c[k]).map(k=>({v:c[k],c:sc[k],l:PROJ_ST[k][0]}));return segs.length?donutBlock(segs):'<div class="g-empty">Aucun projet.</div>';}
  if(type==='bar_charge')return `<div class="bars">${AGENTS.map(a=>{const al=allocAgentWeek(a.id,WEEKS[2]);const r=al/a.cap;return `<div class="barrow"><div class="bl">${esc(a.name.split(' ')[0])} ${esc(a.name.split(' ')[1]||'')}</div><div class="bartrack"><i style="width:${Math.min(r*100,100)}%;background:${r>1?'var(--oxblood)':r>.8?'var(--ocre)':'var(--green)'}"></i></div><div class="bv">${al}/${a.cap}j</div></div>`;}).join('')}</div>`;
  if(type==='bar_budget'){const arr=S.progs.length?S.progs:PROGRAMMES;const m=Math.max(...arr.map(p=>p.budget),1);return arr.length?`<div class="bars">${arr.map(p=>`<div class="barrow"><div class="bl">${esc(p.name)}</div><div class="bartrack"><i style="width:${p.budget/m*100}%;background:${p.color}"></i></div><div class="bv">${fM(p.budget)}</div></div>`).join('')}</div>`:'<div class="g-empty">—</div>';}
  if(type==='bar_avancement'){const arr=S.progs.length?S.progs:PROGRAMMES;return `<div class="bars">${arr.map(p=>{const a=progAvancement(p.id);return `<div class="barrow"><div class="bl">${esc(p.name)}</div><div class="bartrack"><i style="width:${a}%;background:var(--green)"></i></div><div class="bv">${a}%</div></div>`;}).join('')}</div>`;}
  if(type==='kpi_budget'){const tot=S.progs.reduce((s,p)=>s+p.budget,0),cons=S.progs.reduce((s,p)=>s+progConso(p.id),0);
    return kpiGrid([['Alloué',fM(tot)],['Décaissé',fM(cons)],['Solde',fM(tot-cons)],['Taux',tot?Math.round(cons/tot*100):0+' %']]);}
  if(type==='list_retard'){const l=S.tasks.filter(isLate);return l.length?`<div class="up-list">${l.slice(0,7).map(t=>`<div class="up-i" data-task="${t.id}"><span class="al-ic">⚠</span><div class="up-m"><div class="up-t">${esc(t.title)}</div><div class="up-s">${aName(t.assignee)} · échéance ${dShort(t.due)}</div></div></div>`).join('')}</div>`:'<div class="g-empty">Aucune tâche en retard. 👍</div>';}
  if(type==='list_activites'){const u=S.acts.filter(a=>a.start>=TODAY).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="up-list">${u.slice(0,7).map(a=>`<div class="up-i" data-act="${a.id}"><span class="up-ic">${ACT_TYPE_IC[a.type]}</span><div class="up-m"><div class="up-t">${esc(a.name)}</div><div class="up-s">${ACT_TYPES[a.type]} · ${a.lieu} · ${dRange(a.start,a.end)}</div></div>${a.gcal?gIcon():''}</div>`).join('')||'<div class="g-empty">Aucune activité à venir.</div>'}</div>`;}
  if(type==='list_revue'){const l=S.tasks.filter(t=>(t.status==='done'&&!t.valide)||isLate(t));return l.length?`<div class="up-list">${l.slice(0,7).map(t=>`<div class="up-i" data-task="${t.id}"><span class="up-ic">${t.status==='done'?'☑':'⚠'}</span><div class="up-m"><div class="up-t">${esc(t.title)}</div><div class="up-s">${aName(t.assignee)} · ${t.status==='done'?'à valider':'en retard'}</div></div></div>`).join('')}</div>`:'<div class="g-empty">Rien à signaler.</div>';}
  if(type==='alertes'){const progSet=new Set(S.progs.map(p=>p.id));return `<div class="alerts">${S.tasks.filter(isLate).slice(0,3).map(t=>`<div class="alert bad" data-task="${t.id}"><span class="al-ic">⚠</span><div><b>Retard</b> — ${esc(t.title)}<div class="al-s">${aName(t.assignee)} · ${dShort(t.due)}</div></div></div>`).join('')}${INDISPOS.filter(i=>i.from>=TODAY).slice(0,3).map(i=>`<div class="alert"><span class="al-ic">📅</span><div><b>${DISPO_ST[i.type][0]}</b> — ${aName(i.agentId)}<div class="al-s">${i.label} · ${dRange(i.from,i.to)}</div></div></div>`).join('')||''}</div>`;}
  if(type==='table_prog')return `<div class="g-table"><table class="ttable"><thead><tr><th>Programme</th><th>Projets</th><th>Tâches</th><th>Avancement</th><th>Budget</th></tr></thead><tbody>${S.progs.map(p=>`<tr data-proj2="${p.id}"><td><span class="tdot" style="background:${p.color};display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px"></span>${esc(p.name)}</td><td>${projsOfProg(p.id).length}</td><td>${tasksCountProg(p.id)}</td><td>${progAvancement(p.id)}%</td><td class="mono">${fM(p.budget)}</td></tr>`).join('')}</tbody></table></div>`;
  return '';
}

function ovBudgetData(){const f=state.ovBud;
  if(f.proj){const pr=projet(f.proj);if(pr){const items=actsOfProj(f.proj).map(a=>({label:a.name,val:a.budget,color:'var(--ocre)'}));return {tot:pr.budget,cons:projConso(f.proj),items,unit:'activité',title:pr.name};}}
  if(f.prog){const pg=programme(f.prog);if(pg){const items=projsOfProg(f.prog).map(p=>({label:p.name,val:p.budget,color:pg.color}));return {tot:pg.budget,cons:progConso(f.prog),items,unit:'projet',title:pg.name};}}
  return {tot:PROGRAMMES.reduce((s,p)=>s+p.budget,0),cons:PROGRAMMES.reduce((s,p)=>s+progConso(p.id),0),items:PROGRAMMES.map(p=>({label:p.name,val:p.budget,color:p.color})),unit:'programme',title:'Tous les programmes'};
}
