function initDashboards(){state.dashboards=[
  {id:'db_act',owner:'ag1',name:"Suivi des activités",scope:{mode:'all'},access:{read:{mode:'users',users:['ag2','ag5']},write:{mode:'owner',users:[]}},gadgets:[{id:'a',type:'kpi',w:4},{id:'b',type:'list_activites',w:2},{id:'c',type:'donut_taches',w:2},{id:'d',type:'bar_charge',w:2},{id:'e',type:'alertes',w:2}]},
  {id:'db_desc',owner:'ag1',name:"Programme Droits ESC",scope:{mode:'sel',progs:['PRG-DESC'],projs:[]},access:{read:{mode:'members',users:[]},write:{mode:'users',users:['ag2']}},gadgets:[{id:'a',type:'kpi',w:4},{id:'b',type:'table_prog',w:4},{id:'c',type:'bar_avancement',w:2},{id:'d',type:'list_retard',w:2}]},
  {id:'db_dir',owner:'ag4',name:"Comité de direction — budget",scope:{mode:'all'},access:{read:{mode:'users',users:['ag1']},write:{mode:'owner',users:[]}},gadgets:[{id:'a',type:'kpi_budget',w:2},{id:'b',type:'bar_budget',w:2},{id:'c',type:'bar_avancement',w:2},{id:'d',type:'table_prog',w:4}]},

function msField(cid){return `<div class="ms2"><div class="ms2-box"><div class="ms2-tags" id="${cid}-tags"></div><input class="ms2-input" id="${cid}-inp" placeholder="Rechercher puis sélectionner…" autocomplete="off"></div><div class="ms2-drop" id="${cid}-drop"></div></div>`;}
function wireMS(cid,items,set,onchange){
  const paintTags=()=>{$('#'+cid+'-tags').innerHTML=[...set].map(id=>{const it=items.find(x=>x.id===id);return it?`<span class="ms2-tag">${esc(it.label)}<button type="button" data-mrm="${id}">×</button></span>`:'';}).join('')||'<span class="ms2-ph">Aucune sélection</span>';
    $$('#'+cid+'-tags [data-mrm]').forEach(b=>b.onclick=()=>{set.delete(b.dataset.mrm);paintTags();if(onchange)onchange();});};
  const paintDrop=q=>{const ql=(q||'').trim().toLowerCase();if(!ql){$('#'+cid+'-drop').innerHTML='';$('#'+cid+'-drop').classList.remove('open');return;}
    const matches=items.filter(it=>!set.has(it.id)&&it.label.toLowerCase().includes(ql)).slice(0,8);
    $('#'+cid+'-drop').innerHTML=matches.map(it=>`<button type="button" class="ms2-opt" data-madd="${it.id}">${esc(it.label)}</button>`).join('')||'<div class="ms2-none">Aucun résultat</div>';
    $('#'+cid+'-drop').classList.add('open');
    $$('#'+cid+'-drop [data-madd]').forEach(b=>b.onclick=()=>{set.add(b.dataset.madd);$('#'+cid+'-inp').value='';paintDrop('');paintTags();if(onchange)onchange();$('#'+cid+'-inp').focus();});};
  $('#'+cid+'-inp').oninput=e=>paintDrop(e.target.value);
  $('#'+cid+'-inp').onblur=()=>setTimeout(()=>{const dd=$('#'+cid+'-drop');if(dd)dd.classList.remove('open');},180);
  paintTags();
}

/* ===================== REVUE DE COORDINATION ===================== */
function attentionTasks(){return TACHES.filter(t=>isLate(t)||(t.status==='done'&&!t.valide)||t.obstacles);}
function canCoord(){return ['admin','directrice','dir_prog','chef_projet'].includes(meRole());}
function revLien(l){if(!l)return '';let label=l.ref;if(l.type==='projet'){const p=projet(l.ref);label=p?p.name:l.ref;}else if(l.type==='programme'){const p=programme(l.ref);label=p?p.name:l.ref;}return `<span class="rev-lien">${esc(label)}</span>`;}
function renderRevue(){
  if(!state.reviewed)state.reviewed={};
  const sub=state.revSub||'taches';
  const attN=attentionTasks().filter(t=>!state.reviewed[t.id]).length;
  const decN=DECISIONS.filter(d=>d.statut!=='cloturee').length;
  const riskN=RISQUES.filter(r=>r.statut!=='resolu').length;
  const reuN=REUNIONS.filter(r=>r.statut==='planifiee').length;
  const tabs=[['taches','À revoir',attN],['reunions','Réunions',reuN],['decisions','Décisions',decN],['risques','Risques & points d\'attention',riskN]];
  let html=`<div class="rev-subnav">${tabs.map(([k,l,n])=>`<button class="rev-tab ${sub===k?'on':''}" data-rsub="${k}">${esc(l)}${n?`<span class="rev-tc ${k==='risques'||k==='taches'?'warn':''}">${n}</span>`:''}</button>`).join('')}</div><div class="rev-body" id="revBody"></div>`;

  $$('#view [data-rsub]').forEach(b=>b.onclick=()=>{state.revSub=b.dataset.rsub;renderRevue();});
  ({taches:revTaches,reunions:revReunions,decisions:revDecisions,risques:revRisques}[sub]||revTaches)();
}
/* ----- onglet 1 : revue des tâches (existant) ----- */
function revTaches(){

  const base=meeting?TACHES.filter(t=>t.reunion===meeting):attentionTasks();

    <div class="rh-main"><h2>Revue des tâches</h2><p>${meeting?'Passez en revue toutes les tâches issues de cette réunion : faites le point, traitez les obstacles, validez les tâches terminées.':'Passez en revue les tâches qui demandent attention. Sélectionnez une réunion pour revoir toutes ses tâches.'}</p>

        <div class="rev-meeting"><span>Réunion :</span><select id="revMeet"><option value="">Points d'attention (toutes)</option>${REUNIONS.map(r=>`<option value="${esc(r.id)}" ${meeting===r.id?'selected':''}>${esc(r.id)}</option>`).join('')}</select></div>
        <div class="rev-grp"><span>Grouper par :</span><button class="${grp==='prog'?'on':''}" data-rg="prog">Programme</button><button class="${grp==='resp'?'on':''}" data-rg="resp">Responsable</button><button class="${grp==='reunion'?'on':''}" data-rg="reunion">Réunion</button></div>
      </div></div>

  if(!base.length){html+=`<div class="rev-empty"><div style="font-size:30px">✓</div><div style="font-family:var(--serif);font-size:18px;margin-top:6px">${meeting?'Aucune tâche pour cette réunion':'Aucun point d\'attention'}</div><div style="color:var(--ink-soft);font-size:13px">${meeting?'Cette réunion n\'a pas de tâche rattachée.':'Pas de tâche en retard, en obstacle ou en attente de validation.'}</div></div>`;}

    html+=`<div class="rgroup"><div class="rgroup-h">${prog?`<span class="tdot" style="background:${prog.color}"></span>`:''}${esc(g.label)}<span class="rg-c">${g.items.length}</span></div>
      ${g.items.map(t=>{const rv=state.reviewed[t.id];const late=isLate(t);const toval=t.status==='done'&&!t.valide;
        return `<div class="rrow ${rv?'reviewed':''}">
          <span class="rr-st" style="background:${late?'var(--oxblood)':TASK_ST[t.status][1]==='green'?'var(--green)':TASK_ST[t.status][1]==='ocre'?'var(--ocre)':TASK_ST[t.status][1]==='blue'?'var(--blue)':'var(--taupe-2)'}"></span>
          <div class="rr-main"><div class="rr-title" data-ropen="${t.id}">${esc(t.title)}</div>
            <div class="rr-meta">${pill(TASK_ST,t.status)} <span class="rr-key">${t.id}</span> · ${av(t.assignee,true)} ${esc(aName(t.assignee).split(' ')[0])} · ${late?'<span class="late-chip">retard '+dShort(t.due)+'</span>':'éch. '+dShort(t.due)}${toval?' · <span class="toval">à valider</span>':''}</div>
            ${t.obstacles?`<div class="rr-obstacle"><b>Obstacle :</b> ${esc(t.obstacles)}</div>`:''}</div>
          <div class="rr-actions">
            ${toval?`<button class="btn-mini2 val" data-rvalidate="${t.id}">Valider</button>`:''}
            <button class="btn-mini2 ${rv?'done':''}" data-rreview="${t.id}">${rv?'✓ Revue':'Marquer revue'}</button>
          </div></div>`;}).join('')}</div>`;});
  $('#revBody').innerHTML=html;
  $('#revMeet').onchange=e=>{state.revMeeting=e.target.value;revTaches();};

  $$('#revBody [data-rvalidate]').forEach(b=>b.onclick=()=>{const t=TACHES.find(x=>x.id===b.dataset.rvalidate);t.valide=true;t.hist.unshift({a:'Validée formellement (revue)',d:dShort(TODAY)});state.reviewed[t.id]=true;renderRevue();renderNav();persist();gtoast(t.id+' validée formellement');});

}

function donut(segs){const tot=segs.reduce((a,s)=>a+s.v,0)||1;const R=52,C=2*Math.PI*R;let off=0;
  const cir=segs.filter(s=>s.v).map(s=>{const len=s.v/tot*C;const el=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${s.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;off+=len;return el;}).join('');
  return `<svg width="132" height="132" viewBox="0 0 132 132">${cir}<circle cx="66" cy="66" r="40" fill="var(--surface)"/><text x="66" y="62" text-anchor="middle" font-family="var(--serif)" font-size="24" font-weight="600" fill="var(--ink)">${tot}</text><text x="66" y="80" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">tâches</text></svg>`;}
function gIcon(){return `<svg class="gdot" width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" fill="#fff" stroke="#dadce0"/><rect x="4" y="4" width="16" height="4" rx="2" fill="#4285F4"/><circle cx="12" cy="14" r="3" fill="#34A853"/></svg>`;}

/* ===================== KANBAN TRANSVERSAL ===================== */
const KCOLS=[['apl','À faire / planifié'],['cours','En cours'],['attente','En attente / revue'],['termine','Terminé']];
const KTYPES=[['programme','Programmes','kc-prog'],['projet','Projets','kc-proj'],['activite','Activités','kc-act'],['tache','Tâches','kc-task']];
const KGROUPS=[['statut','Statut'],['programme','Programme'],['responsable','Responsable'],['priorite','Priorité']];
function normStatus(kind,o){
  if(kind==='tache')return {todo:'apl',doing:'cours',review:'attente',done:'termine'}[o.status];
  if(kind==='activite')return {planifiee:'apl',cours:'cours',terminee:'termine',annulee:'termine'}[o.status];
  if(kind==='projet')return {planifie:'apl',cours:'cours',suspendu:'attente',termine:'termine'}[o.status];
  return 'cours';
}
function kOwner(it){const o=it.o;return it.kind==='tache'?o.assignee:it.kind==='activite'?o.responsable:o.lead;}
function kProgId(it){const o=it.o;if(it.kind==='programme')return o.id;if(it.kind==='projet')return o.programmeId;if(it.kind==='activite')return (progOfAct(o)||{}).id;return (progOfTask(o)||{}).id;}
function kText(it){return it.kind==='tache'?it.o.title:it.o.name;}
function kanItems(){const kf=state.kf,items=[];
  if(kf.types.has('programme'))PROGRAMMES.forEach(o=>items.push({kind:'programme',o}));
  if(kf.types.has('projet'))PROJETS.forEach(o=>items.push({kind:'projet',o}));
  if(kf.types.has('activite'))ACTIVITES.forEach(o=>items.push({kind:'activite',o}));
  if(kf.types.has('tache'))TACHES.forEach(o=>items.push({kind:'tache',o}));
  return items.filter(it=>{
    if(kf.prog&&kProgId(it)!==kf.prog)return false;
    if(kf.who&&kOwner(it)!==kf.who)return false;
    if(kf.mine&&kOwner(it)!==ME)return false;
    if(kf.late&&!kLate(it))return false;
    if(kf.prio&&!(it.kind==='tache'&&it.o.priority===kf.prio))return false;
    if(kf.q&&!kText(it).toLowerCase().includes(kf.q.toLowerCase()))return false;
    return true;});
}
function kLate(it){const o=it.o;if(it.kind==='tache')return isLate(o);if(it.kind==='activite')return o.end<TODAY&&o.status!=='terminee';if(it.kind==='projet')return o.end<TODAY&&o.status!=='termine';return false;}
function reverseStatus(kind,col){
  if(kind==='tache')return {apl:'todo',cours:'doing',attente:'review',termine:'done'}[col];
  if(kind==='activite')return {apl:'planifiee',cours:'cours',attente:'cours',termine:'terminee'}[col];
  if(kind==='projet')return {apl:'planifie',cours:'cours',attente:'suspendu',termine:'termine'}[col];
  return null;}
function kanObj(kind,id){return kind==='tache'?TACHES.find(x=>x.id===id):kind==='activite'?ACTIVITES.find(x=>x.id===id):kind==='projet'?projet(id):programme(id);}
function kanMove(ref,colKey){const [kind,id]=ref.split(':');const kf=state.kf;const o=kanObj(kind,id);if(!o)return false;
  if(!canEditItem({kind,o})){gtoast('Vous n\'avez pas le droit de modifier cet élément');return false;}
  let changed=false,msg='';
  if(kf.group==='statut'){const ns=reverseStatus(kind,colKey);if(ns&&o.status!==ns){o.status=ns;if(kind==='tache'){o.done=ns==='done'?100:o.done;o.maj=TODAY;}if(o.hist)o.hist.unshift({a:'Statut → '+(KCOLS.find(c=>c[0]===colKey)||['',colKey])[1],d:dShort(TODAY)});changed=true;msg='Statut mis à jour';}}
  else if(kf.group==='responsable'){const fld=kind==='tache'?'assignee':kind==='activite'?'responsable':'lead';if(colKey!=='__none'&&o[fld]!==colKey){o[fld]=colKey;changed=true;msg='Confié·e à '+firstName(colKey);}}
  else if(kf.group==='priorite'){if(kind==='tache'&&colKey!=='__none'&&o.priority!==colKey){o.priority=colKey;changed=true;msg='Priorité → '+PRIO[colKey][0];}}

/* ===================== PLAN (Chronologie / Liste / Capacité) ===================== */
const PLAN_START='2026-01-01';
function dnum(d){return Math.round((new Date(d+'T00:00:00')-new Date(PLAN_START+'T00:00:00'))/86400000);}
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);}
const PLAN_DAYS=365;
const MONTHS_FR=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
function planExp(id){return state.plan.expanded.has(id);}
function planToggle(id){state.plan.expanded.has(id)?state.plan.expanded.delete(id):state.plan.expanded.add(id);renderPlan();}
function planRows(){const rows=[];const exp=planExp;
  PROGRAMMES.forEach(pg=>{rows.push({kind:'programme',o:pg,depth:0,id:'P:'+pg.id,gid:pg.id});
    if(exp('P:'+pg.id)){
      projsOfProg(pg.id).forEach(pr=>{rows.push({kind:'projet',o:pr,depth:1,id:'J:'+pr.id,gid:pr.id});
        if(exp('J:'+pr.id)){
          actsOfProj(pr.id).forEach(ac=>{rows.push({kind:'activite',o:ac,depth:2,id:'A:'+ac.id,gid:ac.id});
            if(exp('A:'+ac.id))tasksOfAct(ac.id).forEach(t=>rows.push({kind:'tache',o:t,depth:3,id:'T:'+t.id,gid:t.id}));});
          directTasksOfProj(pr.id).forEach(t=>rows.push({kind:'tache',o:t,depth:2,id:'T:'+t.id,gid:t.id}));
        }});
      actsDirectOfProg(pg.id).forEach(ac=>{rows.push({kind:'activite',o:ac,depth:1,id:'A:'+ac.id,gid:ac.id});
        if(exp('A:'+ac.id))tasksOfAct(ac.id).forEach(t=>rows.push({kind:'tache',o:t,depth:2,id:'T:'+t.id,gid:t.id}));});
    }});
  return rows;}
function planDates(row){const o=row.o;
  if(row.kind==='tache')return [o.start,o.due];
  if(row.kind==='activite'||row.kind==='projet')return [o.start,o.end];
  const pr=projsOfProg(o.id),ac=actsDirectOfProg(o.id);const all=pr.map(p=>[p.start,p.end]).concat(ac.map(a=>[a.start,a.end]));
  if(all.length){const s=all.map(x=>x[0]).sort()[0];const e=all.map(x=>x[1]).sort().slice(-1)[0];return [o.dateStart&&o.dateStart<s?o.dateStart:s,o.dateEnd&&o.dateEnd>e?o.dateEnd:e];}
  return [o.dateStart||PLAN_START,o.dateEnd||addDays(PLAN_START,364)];}
function planEditable(row){if(row.kind==='tache')return canEditTask(row.o);if(row.kind==='programme')return canEditProgId(row.o.id);if(row.kind==='projet')return canEditProgId(row.o.programmeId);return canEditProgId((progOfAct(row.o)||{}).id);}
const PLAN_COL={programme:'var(--acajou)',projet:'var(--blue)',activite:'var(--ocre)',tache:'var(--taupe)'};
function blockersOf(t){return (t.issueLinks||[]).filter(l=>l.type==='blockedby').map(l=>l.key);}
function blocksCount(id){return TACHES.filter(t=>blockersOf(t).includes(id)).length;}
function isBottleneck(t){const bc=blocksCount(t.id);return bc>=2||(bc>=1&&isLate(t));}

function renderPlan(){
  if(!state.plan){const ex=new Set();PROGRAMMES.forEach(p=>ex.add('P:'+p.id));PROJETS.forEach(p=>ex.add('J:'+p.id));ACTIVITES.forEach(a=>ex.add('A:'+a.id));state.plan={view:'timeline',scale:'month',expanded:ex};}
  const pl=state.plan;const canCap=canSeeModule('workload');if(pl.view==='capacity'&&!canCap)pl.view='timeline';

    <button class="${pl.view==='list'?'on':''}" data-pv="list"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 5h18v14H3zM3 10h18M9 5v14"/></svg>Liste</button>
    ${canCap?`<button class="${pl.view==='capacity'?'on':''}" data-pv="capacity"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 3v18h18M7 14l3-4 3 3 4-6"/></svg>Plan de charge</button>`:''}
    ${pl.view==='timeline'?`<div class="plan-zoom"><span>Échelle</span><button class="${pl.scale==='month'?'on':''}" data-pz="month">Mois</button><button class="${pl.scale==='week'?'on':''}" data-pz="week">Semaines</button></div>`:''}
    ${pl.view==='list'?`<div class="plan-zoom"><button class="exp-btn" id="plExport">⤓ Exporter CSV</button></div>`:''}
  </div>`;

  $$('#view [data-pv]').forEach(b=>b.onclick=()=>{pl.view=b.dataset.pv;renderPlan();});
  $$('#view [data-pz]').forEach(b=>b.onclick=()=>{pl.scale=b.dataset.pz;renderPlan();});

  if(pl.view==='timeline')wirePlanTimeline();
  else if(pl.view==='list')wirePlanList();
  else {$$('#view [data-cg]').forEach(b=>b.onclick=()=>{pl.capGroup=b.dataset.cg;renderPlan();});
    const setCap=(id,v)=>{const a=agent(id);a.cap=Math.max(1,Math.min(7,v));renderPlan();};
    $$('#view [data-cap]').forEach(b=>b.onclick=()=>{const [id,op]=b.dataset.cap.split(':');setCap(id,agent(id).cap+(op==='+'?1:-1));});
    $$('#view [data-capin]').forEach(inp=>inp.onchange=()=>setCap(inp.dataset.capin,+inp.value||1));}
}

/* ---------- Chronologie (Gantt) ---------- */
function planTimeline(){
  const pl=state.plan;const ppd=pl.scale==='week'?8.2:3.3;const trackW=Math.round(PLAN_DAYS*ppd);const labW=300,rowH=34,headH=46;
  const rows=planRows();
  // entêtes mois
  let mhtml='',acc=0;for(let m=0;m<12;m++){const dim=new Date(2026,m+1,0).getDate();mhtml+=`<div class="g-month" style="width:${Math.round(dim*ppd)}px">${MONTHS_FR[m]}</div>`;acc+=dim;}
  // lignes + barres
  const idx={};rows.forEach((r,i)=>{if(r.kind==='tache')idx[r.o.id]=i;});
  let rhtml='';rows.forEach((r,i)=>{
    const [s,e]=planDates(r);const x=Math.max(dnum(s),0)*ppd;const w=Math.max((dnum(e)-dnum(s)+1)*ppd,6);
    const o=r.o;const ed=planEditable(r);const bott=r.kind==='tache'&&isBottleneck(o);
    const label=r.kind==='tache'?o.title:o.name;const ic=r.kind==='activite'?ACT_TYPE_IC[o.type]+' ':'';
    const hasKids=(r.kind==='programme')||(r.kind==='projet')||(r.kind==='activite'&&tasksOfAct(o.id).length);
    const open=planExp(r.id);
    const barLabel=w>54?`<span class="gb-l">${esc(label)}</span>`:'';
    const prog=r.kind==='tache'?(o.status==='done'?100:o.done||0):r.kind==='projet'?projProgress(o.id):r.kind==='activite'?(tasksOfAct(o.id).length?Math.round(tasksOfAct(o.id).filter(t=>t.status==='done').length/tasksOfAct(o.id).length*100):0):0;
    rhtml+=`<div class="g-row" style="height:${rowH}px">
      <div class="g-label d${r.depth}" ${hasKids?`data-ptog="${r.id}"`:''}>${hasKids?`<span class="g-caret ${open?'open':''}">${chev()}</span>`:'<span class="g-caret-sp"></span>'}<span class="g-dot" style="background:${PLAN_COL[r.kind]}"></span><span class="g-lt" data-popen="${r.kind}:${o.id}">${ic}${esc(label)}</span></div>
      <div class="g-track">
        <div class="g-bar ${r.kind} ${bott?'bottleneck':''} ${ed?'drag':''}" data-gid="${r.id}" style="left:${x}px;width:${w}px;background:${bott?'var(--oxblood)':PLAN_COL[r.kind]}">
          ${ed?'<span class="gb-h gb-l-h" data-h="l"></span>':''}<span class="gb-fill" style="width:${prog}%"></span>${barLabel}${ed?'<span class="gb-h gb-r-h" data-h="r"></span>':''}
          ${bott?'<span class="gb-flag" title="Goulot d\'étranglement">⚠</span>':''}
        </div>
      </div></div>`;
  });
  // flèches de dépendance
  const today=dnum(TODAY)*ppd;
  let deps='';rows.forEach((r,i)=>{if(r.kind!=='tache')return;blockersOf(r.o).forEach(pk=>{const pi=idx[pk];if(pi==null)return;
    const pr=rows[pi];const [ps,pe]=planDates(pr);const [ss]=planDates(r);
    const x1=(dnum(pe)+1)*ppd, y1=pi*rowH+rowH/2, x2=Math.max(dnum(ss),0)*ppd, y2=i*rowH+rowH/2;
    const mx=Math.max(x1+10,x2-10);
    deps+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" class="g-dep ${isBottleneck(pr.o)?'crit':''}"/><circle cx="${x2}" cy="${y2}" r="2.5" class="g-dep-dot"/>`;});});
  return `<div class="gantt" style="--labw:${labW}px">
    <div class="gantt-scroll"><div class="gantt-inner" style="width:${labW+trackW}px">
      <div class="gantt-head"><div class="g-corner">Élément</div><div class="g-months" style="width:${trackW}px">${mhtml}</div></div>
      <div class="gantt-body">
        <div class="g-today" style="left:${labW+today}px"></div>
        ${rhtml}
        <svg class="g-deps" style="left:${labW}px;width:${trackW}px;height:${rows.length*rowH}px">${deps}</svg>
      </div>

function wirePlanTimeline(){
  const pl=state.plan;const ppd=pl.scale==='week'?8.2:3.3;
  $$('#view [data-ptog]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-popen]'))return;planToggle(b.dataset.ptog);});
  $$('#view [data-popen]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [k,id]=b.dataset.popen.split(':');k==='programme'?openProgDrawer(id):k==='projet'?openProjDrawer(id):k==='activite'?openActDrawer(id):openTaskDrawer(id);});
  $$('#view .g-bar.drag').forEach(bar=>{
    const start=ev=>{ev.preventDefault();const handle=ev.target.dataset.h;const mode=handle||'move';const x0=ev.clientX;const L0=parseFloat(bar.style.left),W0=parseFloat(bar.style.width);
      bar.classList.add('dragging');
      const move=e=>{const dd=Math.round((e.clientX-x0)/ppd);
        if(mode==='move'){bar.style.left=(L0+dd*ppd)+'px';}
        else if(mode==='r'){bar.style.width=Math.max(6,(W0+dd*ppd))+'px';}
        else{const nl=L0+dd*ppd,nw=W0-dd*ppd;if(nw>=6){bar.style.left=nl+'px';bar.style.width=nw+'px';}}};
      const up=e=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
        const dd=Math.round((e.clientX-x0)/ppd);if(dd!==0)applyPlanDrag(bar.dataset.gid,mode,dd);else renderPlan();};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);};
    bar.addEventListener('pointerdown',start);
  });
}
function applyPlanDrag(rid,mode,dd){const [pre,id]=rid.split(':');
  const o=pre==='T'?TACHES.find(x=>x.id===id):pre==='A'?ACTIVITES.find(x=>x.id===id):pre==='J'?projet(id):programme(id);
  if(!o){renderPlan();return;}
  const sf=pre==='T'?'start':(pre==='P'?'dateStart':'start');const ef=pre==='T'?'due':(pre==='P'?'dateEnd':'end');
  if(mode==='move'){o[sf]=addDays(o[sf],dd);o[ef]=addDays(o[ef],dd);}
  else if(mode==='r'){o[ef]=addDays(o[ef],dd);if(o[ef]<o[sf])o[ef]=o[sf];}
  else{o[sf]=addDays(o[sf],dd);if(o[sf]>o[ef])o[sf]=o[ef];}
  if(o.maj!==undefined)o.maj=TODAY;if(o.hist)o.hist.unshift({a:'Planning ajusté (chronologie)',d:dShort(TODAY)});
  audit('a ajusté le planning',rid.split(':')[1]);renderPlan();gtoast('Planning mis à jour');
}

/* ---------- Capacité & vélocité ---------- */
function planCapacity(){
  const pl=state.plan;if(!pl.capGroup)pl.capGroup='agent';const weeks=WEEKS;
  // synthèse par semaine
  let weekSum=weeks.map(w=>{let load=0,cap=0;AGENTS.forEach(a=>{load+=allocAgentWeek(a.id,w);cap+=a.cap;});return {w,load,cap,r:load/cap};});
  const teamCap=AGENTS.reduce((s,a)=>s+a.cap,0);
  const doneTot=TACHES.filter(t=>t.status==='done').length;
  const velTeam=(doneTot/weeks.length).toFixed(1);
  let head=`<div class="cap-summary">
    <div class="cap-kpi"><div class="ck-l">Capacité équipe / semaine</div><div class="ck-n mono">${teamCap} j</div><div class="ck-s">${AGENTS.length} collaborateurs</div></div>
    <div class="cap-kpi"><div class="ck-l">Vélocité moyenne</div><div class="ck-n mono">${velTeam}</div><div class="ck-s">tâches terminées / semaine</div></div>
    <div class="cap-kpi"><div class="ck-l">Semaines en surcharge</div><div class="ck-n mono">${weekSum.filter(x=>x.r>1).length}</div><div class="ck-s">sur ${weeks.length} itérations</div></div>
  </div>
  <div class="cap-weekbars"><div class="cwb-head"><div class="cwb-h">Charge agrégée par itération (semaine)</div><div class="cap-grp"><span>Regrouper par</span><button class="${pl.capGroup==='agent'?'on':''}" data-cg="agent">Collaborateur</button><button class="${pl.capGroup==='team'?'on':''}" data-cg="team">Équipe</button></div></div><div class="cwb-grid">${weekSum.map(x=>`<div class="cwb-col"><div class="cwb-bar"><i style="height:${Math.min(x.r*100,100)}%;background:${x.r>1?'var(--oxblood)':x.r>.85?'var(--ocre)':'var(--green)'}"></i>${x.r>1?'<span class="cwb-over">surcharge</span>':''}</div><div class="cwb-l">${x.w.label}</div><div class="cwb-v mono">${x.load}/${x.cap}j</div></div>`).join('')}</div></div>`;
  const agRow=a=>{const vel=TACHES.filter(t=>t.assignee===a.id&&t.status==='done').length;const open=TACHES.filter(t=>t.assignee===a.id&&t.status!=='done').length;const ced=isFull()||meRole()==='dir_prog';
    return `<tr><td class="wl-agent">${av(a.id)}<div><b>${esc(a.name)}</b><span>${esc(a.role)}</span></div></td><td style="text-align:center">${ced?`<div class="cap-step"><button data-cap="${a.id}:-">−</button><input type="number" min="1" max="7" value="${a.cap}" data-capin="${a.id}"><button data-cap="${a.id}:+">+</button></div>`:`<span class="mono">${a.cap} j</span>`}</td>${weeks.map(w=>{const al=allocAgentWeek(a.id,w);const r=al/a.cap;const indispo=INDISPOS.some(i=>i.agentId===a.id&&!(i.to<w.from||i.from>w.to));const col=r>1?'var(--oxblood)':r>.85?'var(--ocre)':r>0?'var(--green)':'var(--line)';
      return `<td class="cap-cell ${indispo?'indispo':''}"><div class="cap-mini"><i style="height:${Math.min(r*100,100)}%;background:${col}"></i></div><span class="cap-v">${al}</span></td>`;}).join('')}
      <td class="cap-vel"><span class="cv-done">${vel} ✓</span><span class="cv-open">${open} en cours</span></td></tr>`;};
  let tbl=`<div class="tbl-wrap"><table class="cap-table"><thead><tr><th>Collaborateur</th><th>Capacité</th>${weeks.map(w=>`<th>${w.label}</th>`).join('')}<th>Vélocité</th></tr></thead><tbody>`;
  if(pl.capGroup==='team'){
    const teams=PROGRAMMES.map(p=>({id:p.id,name:p.name,color:p.color,agents:AGENTS.filter(a=>a.prog===p.id)}))
      .concat([{id:'__dir',name:'Direction & transverse',color:'var(--taupe)',agents:AGENTS.filter(a=>!a.prog)}]).filter(t=>t.agents.length);
    teams.forEach(tm=>{const cap=tm.agents.reduce((s,a)=>s+a.cap,0);const vel=tm.agents.reduce((s,a)=>s+TACHES.filter(t=>t.assignee===a.id&&t.status==='done').length,0);
      tbl+=`<tr class="cap-team"><td><span class="g-dot" style="background:${tm.color}"></span><b>${esc(tm.name)}</b> <span class="ct-n">${tm.agents.length} pers.</span></td><td class="mono" style="text-align:center">${cap} j</td>${weeks.map(w=>{const al=tm.agents.reduce((s,a)=>s+allocAgentWeek(a.id,w),0);const r=cap?al/cap:0;return `<td class="mono cap-tcell" style="color:${r>1?'var(--oxblood)':r>.85?'var(--ocre)':'var(--ink-soft)'}">${al}<span class="ct-cap">/${cap}</span></td>`;}).join('')}<td class="cap-vel"><span class="cv-done">${vel} ✓</span></td></tr>`;
      tm.agents.forEach(a=>tbl+=agRow(a));});
  } else AGENTS.forEach(a=>tbl+=agRow(a));
  tbl+=`</tbody></table></div>`;
  return head+tbl+`<div class="wl-note">La vélocité compte les tâches terminées par collaborateur. Regroupez par équipe (programme) pour suivre la charge globale d'une équipe et arbitrer les réaffectations avant un sprint ; les itérations en surcharge sont signalées en rouge.</div>`;
}

/* ===================== CALENDRIER ===================== */
function renderCalendar(){
  const y=2026,mo=5; // juin (0-indexed)
  const first=new Date(y,mo,1), startW=(first.getDay()+6)%7; // lundi=0
  const days=new Date(y,mo+1,0).getDate();
  const cells=[];for(let i=0;i<startW;i++)cells.push(null);for(let d=1;d<=days;d++)cells.push(d);
  while(cells.length%7)cells.push(null);
  const dstr=d=>`2026-06-${String(d).padStart(2,'0')}`;
  let grid='';
  ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(d=>grid+=`<div class="cal-dh">${d}</div>`);
  cells.forEach(d=>{
    if(!d){grid+='<div class="cal-cell empty"></div>';return;}
    const ds=dstr(d), isToday=ds===TODAY;
    const acts=ACTIVITES.filter(a=>a.start<=ds&&a.end>=ds);
    const tasks=TACHES.filter(t=>t.due===ds);
    grid+=`<div class="cal-cell ${isToday?'today':''}"><div class="cal-d">${d}${isToday?'<span class="cal-now">aujourd\'hui</span>':''}</div>
      ${acts.map(a=>`<div class="cal-act ${a.type}" data-act="${a.id}" title="${esc(a.name)}">${ACT_TYPE_IC[a.type]} ${esc(a.name)}${a.gcal?' ·G':''}</div>`).join('')}
      ${tasks.map(t=>`<div class="cal-task ${isLate(t)?'late':''}" data-tl="${t.id}" title="${esc(t.title)}"><span class="ct-dot"></span>${esc(t.title)}</div>`).join('')}
    </div>`;
  });
  $('#view').innerHTML=`
    <div class="cal-top"><div class="cal-month">Juin 2026</div>
      <div class="gsync ${state.gsync?'on':''}" id="gsyncBtn">${gFull()}<span>${state.gsync?'Synchronisé · Google Agenda':'Synchroniser avec Google Agenda'}</span></div>
      <div class="cal-leg">${Object.entries(ACT_TYPES).map(([k,v])=>`<span class="cleg"><i class="cl-${k}"></i>${v}</span>`).join('')}</div>
    </div>
    <div class="cal-grid">${grid}</div>`;
  $$('#view [data-act]').forEach(e=>e.onclick=()=>openActDrawer(e.dataset.act));
  $$('#view [data-tl]').forEach(e=>e.onclick=()=>openTaskDrawer(e.dataset.tl));
  $('#gsyncBtn').onclick=()=>{state.gsync=!state.gsync;renderCalendar();gtoast(state.gsync?'Calendrier synchronisé avec Google Agenda':'Synchronisation désactivée');};
}

/* ===================== BUDGET ===================== */
/* ===== modèle budgétaire : lignes par rubrique (alloué / engagé / décaissé) ===== */
const RUBRIQUES=[['Personnel',.35,.92,.58],['Activités',.30,.55,.32],['Fonctionnement',.15,.72,.60],['Équipement',.12,.45,.40],['Déplacements',.08,.66,.48]];
function hashCoef(id){let h=7;for(const c of String(id))h=(h*31+c.charCodeAt(0))%997;return .82+(h%30)/100;}
function projLignes(pr){if(pr.lignes)return pr.lignes;const k=hashCoef(pr.id);let acc=0;
  pr.lignes=RUBRIQUES.map((r,i)=>{const al=i===RUBRIQUES.length-1?Math.max(pr.budget-acc,0):Math.round(pr.budget*r[1]/10000)*10000;acc+=al;
    const eng=Math.round(Math.min(al,al*Math.min(r[2]*k,1))/10000)*10000;const cons=Math.round(Math.min(eng,al*r[3]*k)/10000)*10000;
    return {rub:r[0],alloue:al,engage:eng,consomme:cons};});
  return pr.lignes;}
function progLignes(prog){if(prog.proglignes)return prog.proglignes;
  const projSum=projsOfProg(prog.id).reduce((s,p)=>s+p.budget,0);const R=Math.max((prog.budget||0)-projSum,0);const k=hashCoef(prog.id);
  if(R<=0){prog.proglignes=[];return prog.proglignes;}
  const co=Math.round(R*0.62/10000)*10000, se=R-co;
  prog.proglignes=[{rub:'Coordination',alloue:co,engage:Math.round(co*0.9/10000)*10000,consomme:Math.round(co*0.62*k/10000)*10000},
    {rub:'Suivi & évaluation',alloue:se,engage:Math.round(se*0.72/10000)*10000,consomme:Math.round(se*0.5*k/10000)*10000}];
  return prog.proglignes;}
function projEngage(id){const pr=projet(id);return pr?projLignes(pr).reduce((s,l)=>s+l.engage,0):0;}
function projConso(id){const pr=projet(id);return pr?projLignes(pr).reduce((s,l)=>s+l.consomme,0):0;}
function progEngage(id){const p=programme(id);if(!p)return 0;return projsOfProg(id).reduce((s,x)=>s+projEngage(x.id),0)+progLignes(p).reduce((s,l)=>s+l.engage,0);}
function progConso(id){const p=programme(id);if(!p)return 0;return projsOfProg(id).reduce((s,x)=>s+projConso(x.id),0)+progLignes(p).reduce((s,l)=>s+l.consomme,0);}
function projAgg(id,rub){let al=0,en=0,co=0;projLignes(projet(id)).forEach(l=>{if(!rub||l.rub===rub){al+=l.alloue;en+=l.engage;co+=l.consomme;}});return {al,en,co};}
function progLineAgg(prog,rub){let al=0,en=0,co=0;progLignes(prog).forEach(l=>{if(!rub||l.rub===rub){al+=l.alloue;en+=l.engage;co+=l.consomme;}});return {al,en,co};}
function progAgg(id,rub){const prog=programme(id);let a=progLineAgg(prog,rub);projsOfProg(id).forEach(pr=>{const x=projAgg(pr.id,rub);a={al:a.al+x.al,en:a.en+x.en,co:a.co+x.co};});return a;}
/* ligne en quasi-dépassement (démo pilotage : projet à risque élevé) */
(function(){const pr=projet('PRJ-DEF');if(pr)pr.lignes=[{rub:'Personnel',alloue:5000000,engage:5000000,consomme:4800000},{rub:'Activités',alloue:4000000,engage:4000000,consomme:3850000},{rub:'Fonctionnement',alloue:1500000,engage:1500000,consomme:1460000},{rub:'Équipement',alloue:1000000,engage:920000,consomme:880000},{rub:'Déplacements',alloue:500000,engage:480000,consomme:470000}];})();

function renderBudget(){

  let al=0,en=0,co=0;const inScope=[];
  const progList=f.prog?[programme(f.prog)]:PROGRAMMES;
  progList.forEach(prog=>{if(!prog)return;
    const projs=f.proj?[projet(f.proj)].filter(Boolean):projsOfProg(prog.id);
    projs.forEach(pr=>{const x=projAgg(pr.id,f.rub);al+=x.al;en+=x.en;co+=x.co;});
    if(!f.proj){const x=progLineAgg(prog,f.rub);al+=x.al;en+=x.en;co+=x.co;}});
  const solde=al-co, tEng=al?Math.round(en/al*100):0, tDec=al?Math.round(co/al*100):0;
  // répartition par rubrique (décaissé) sur le périmètre
  const rubTot={};RUBRIQUES.forEach(r=>rubTot[r[0]]=0);['Coordination','Suivi & évaluation'].forEach(r=>rubTot[r]=0);

    if(!f.proj)progLignes(prog).forEach(l=>{if(!f.rub||l.rub===f.rub)rubTot[l.rub]=(rubTot[l.rub]||0)+l.consomme;});});
  const rubArr=Object.keys(rubTot).filter(k=>rubTot[k]>0);const rubMax=Math.max(...rubArr.map(k=>rubTot[k]),1);

  else progList.forEach(prog=>{if(!prog)return;const a=progAgg(prog.id,f.rub);const key='bp_'+prog.id;const op=state.budExp.has(key);
    rows+=row(prog.name,0,a.al,a.en,a.co,key,op,prog.color);

      const pl=progLignes(prog).filter(l=>!f.rub||l.rub===f.rub);

  const projOpts=f.prog?projsOfProg(f.prog):PROJETS;
  const engND=Math.max(en-co,0),dispo=Math.max(al-en,0);
  $('#view').innerHTML=`

function penIc(){return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';}
function fldDisp(o,s){const v=o[s.key];
  if(s.type==='sel'){const m=(s.opts||[]).find(x=>String(x[0])===String(v));return m?esc(m[1]):'<span class="faintv">—</span>';}
  if(s.type==='pill')return pill(s.map,v);
  if(s.type==='risk')return `<span class="pill ${RISK[v][1]}">${RISK[v][0]}</span>`;
  if(s.type==='prio')return pill(PRIO,v);
  if(s.type==='bool')return v?'<span class="pill green">Oui</span>':'<span class="pill ocre">Non</span>';
  if(s.type==='agent')return v?av(v,true)+' '+esc(aName(v)):'<span class="faintv">—</span>';
  if(s.type==='date')return v?dLong(v):'<span class="faintv">—</span>';
  if(s.type==='num')return `<span class="mono">${fcfa(v||0)}</span>`;
  if(s.type==='charge')return `<span class="mono">${(v||0)} j</span>`;
  return v==null||v===''?'<span class="faintv">—</span>':esc(v);
}
function fldRow(o,s,ce){return `<div class="fld ${s.type==='area'?'fld-big':''}" data-fk="${s.key}">${s.label?`<span class="fld-k">${s.label}</span>`:''}<span class="fld-v"><span class="fld-disp">${fldDisp(o,s)}</span>${ce?`<button class="fld-pen" data-pen="${s.key}" title="Modifier">${penIc()}</button>`:''}</span></div>`;}
function fldList(o,specs,ce){return `<div class="fld-list">${specs.map(s=>fldRow(o,s,ce)).join('')}</div>`;}
function fldEditor(o,s){const v=o[s.key];
  if(s.type==='area')return `<textarea class="fld-input" rows="3">${esc(v==null?'':v)}</textarea>`;
  if(s.type==='date')return `<input class="fld-input" type="date" value="${v||''}">`;
  if(s.type==='num')return `<input class="fld-input mono" type="number" min="0" step="50000" value="${v||0}">`;
  if(s.type==='charge')return `<input class="fld-input mono" type="number" min="0" step="0.5" value="${v||0}">`;
  if(s.type==='bool')return `<select class="fld-input"><option value="1" ${v?'selected':''}>Oui</option><option value="0" ${!v?'selected':''}>Non</option></select>`;
  let opts=s.opts;
  if(s.type==='pill')opts=Object.entries(s.map).map(([k,vv])=>[k,vv[0]]);
  if(s.type==='prio')opts=Object.entries(PRIO).map(([k,vv])=>[k,vv[0]]);
  if(s.type==='risk')opts=Object.entries(RISK).map(([k,vv])=>[k,vv[0]]);
  if(s.type==='agent')opts=AGENTS.map(g=>[g.id,g.name]);
  if(opts)return `<select class="fld-input">${opts.map(([val,lab])=>`<option value="${val}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`).join('')}</select>`;
  return `<input class="fld-input" value="${esc(v==null?'':v)}">`;
}
function readEd(el,s){if(s.type==='num'||s.type==='charge')return +el.value||0;if(s.type==='bool')return el.value==='1';return el.value;}
function saveFiche(o,label){o.maj=TODAY;audit('a modifié la fiche',(o.id||o.code||'')+(label?' · '+label:''));persist();renderNav();gtoast('Champ modifié');if(state.module)render();}
function wireFields(o,specs,rerender){
  $$('#taskFull .fld[data-fk]').forEach(row=>{
    const key=row.dataset.fk;const s=specs.find(x=>x.key===key);if(!s)return;
    const pen=row.querySelector('[data-pen]');if(!pen)return;
    const start=()=>{
      const vbox=row.querySelector('.fld-v');row.classList.add('editing');
      vbox.innerHTML=`<span class="fld-editor">${fldEditor(o,s)}</span><span class="fld-acts"><button class="fld-ok"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5L20 6"/></svg></button><button class="fld-cancel"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>`;
      const inp=vbox.querySelector('.fld-input');if(inp){inp.focus();if(inp.select&&(s.type==='text'||s.type==='area'||s.type==='num'||s.type==='charge'||!s.type))try{inp.select();}catch(e){}}
      const ok=()=>{o[s.key]=readEd(inp,s);_tfScroll=tfScroll();saveFiche(o,s.label);rerender();};
      const cancel=()=>{_tfScroll=tfScroll();rerender();};
      vbox.querySelector('.fld-ok').onclick=ok;vbox.querySelector('.fld-cancel').onclick=cancel;
      if(inp&&s.type!=='area')inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok();}else if(e.key==='Escape'){e.preventDefault();cancel();}};
    };
    pen.onclick=start;
    const disp=row.querySelector('.fld-disp');if(disp){disp.classList.add('editable');disp.onclick=start;}
  });
}

function openActFull(id){const a=activite(id);if(!a)return;const pr=projOfAct(a),prog=progOfAct(a),ts=tasksOfAct(id);
  const ce=canEditProgId((prog||{}).id);const done=ts.filter(t=>t.status==='done').length;const prog2=ts.length?Math.round(done/ts.length*100):0;

  const badges=`<span class="dw-key">${a.id}</span>${pill(ACT_ST,a.status)}<span class="actt-chip">${ACT_TYPE_IC[a.type]} ${ACT_TYPES[a.type]}</span>${a.gcal?gIcon():''}${ce?'':'<span class="pill ro-pill">Lecture seule</span>'}`;
  const detailSpecs=[{key:'resultat',label:'Résultat attendu',type:'area'},{key:'indicateur',label:'Indicateur de réalisation',type:'text'}];

  const budgetSpecs=[{key:'budget',label:'Budget prévu',type:'num'},{key:'depense',label:'Montant dépensé',type:'num'}];
  const main=`
    ${efCard('Détails', fldList(a,detailSpecs,ce))}
    ${canSeeBudget()?efCard('Budget', fldList(a,budgetSpecs,ce)+`<div class="ef-solde">Solde disponible : <b class="${solde<0?'bad':''}">${fcfa(solde)}</b></div>`):''}
    ${efCard('Avancement des tâches', `<div class="mini-prog2"><i style="width:${prog2}%"></i></div><div class="pf-tasks">${ts.map(t=>`<div class="pf-task" data-tl="${t.id}"><span class="tcheck ${t.status==='done'?'done':''}">${t.status==='done'?'✓':''}</span><span class="${t.status==='done'?'strike':''}">${esc(t.title)}</span>${pill(TASK_ST,t.status)}<span class="tmeta">${dShort(t.due)}</span>${av(t.assignee,true)}</div>`).join('')||'<div class="pf-empty">Aucune tâche.</div>'}</div>${ce?`<button class="btn-add-row" id="tfAddTask"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Ajouter une tâche</button>`:''}`,done+'/'+ts.length)}
    ${efCard('Réunions liées', reus.length?`<div class="reul">${reus.map(r=>`<div class="reu-i">📅 ${esc(r)}</div>`).join('')}</div>`:'<div class="empty-line">Aucune réunion rattachée.</div>')}`;
  const side=`
    ${efCard('Propriétés', fldList(a,propSpecs,ce))}
    ${efCard('Agents & prestataires', `<div class="members2">${(a.prestataires||[]).map(p=>{const ag=agent(p);return ag?`<span class="mem2">${av(p,true)} ${esc(ag.name)}</span>`:`<span class="mem2">${esc(p)}</span>`;}).join('')||'<span class="faint">—</span>'}</div>`)}
    ${efCard('Intégration', `<button class="ichip" id="tfGcal">${gFull()}<span>${a.gcal?'Synchronisé avec Google Agenda':'Ajouter à Google Agenda'}</span></button>`)}`;
  showFull({obj:a,nameKey:'name',ce,accent:prog?prog.color:'#7A6962',bc,badges,subt:`${ACT_TYPE_IC[a.type]} ${ACT_TYPES[a.type]} · maj ${dShort(a.maj)}`,main,side,rerender:()=>openActFull(id),reduce:()=>{closeTaskFull();openActDrawer(id);},wire:()=>{
    wireFields(a,detailSpecs.concat(propSpecs,budgetSpecs),()=>openActFull(id));
    $$('#taskFull [data-tl]').forEach(e=>e.onclick=()=>openTaskFull(e.dataset.tl));
    $$('#taskFull [data-projopen]').forEach(e=>e.onclick=()=>{closeTaskFull();openProjDrawer(e.dataset.projopen);});
    if($('#tfAddTask'))$('#tfAddTask').onclick=()=>{closeTaskFull();openTaskModal({activiteId:id});};
    if($('#tfGcal'))$('#tfGcal').onclick=()=>{a.gcal=true;gtoast('Ajoutée à Google Agenda');openActFull(id);};
  }});
}

function openProjFull(id){const pr=projet(id);if(!pr)return;const prog=programme(pr.programmeId);

  const badges=`<span class="dw-key">${pr.code}</span>${pill(PROJ_ST,pr.status)}${healthDot(projHealth(id))}${ce?'':'<span class="pill ro-pill">Lecture seule</span>'}`;

  showFull({obj:pr,nameKey:'name',ce,accent:prog.color,bc,badges,subt:`Projet · ${esc(prog.name)} · maj ${dShort(pr.maj||TODAY)}`,main,side,rerender:()=>openProjFull(id),reduce:()=>{closeTaskFull();openProjDrawer(id);},wire:()=>{
    wireFields(pr,objSpecs.concat(benefSpecs,budgetSpecs,propSpecs,kpiSpecs),()=>openProjFull(id));
    $$('#taskFull [data-actopen]').forEach(e=>e.onclick=()=>{closeTaskFull();openActFull(e.dataset.actopen);});

function paintDocs(){$('#dcList').innerHTML=newDocs.map((d,i)=>`<div class="liv-row"><span>${esc(d.label)}${d.val?' — '+esc(d.val):''}</span><button class="de-rm" data-rmd="${i}" type="button">×</button></div>`).join('');$$('[data-rmd]').forEach(b=>b.onclick=()=>{newDocs.splice(+b.dataset.rmd,1);paintDocs();});}
function wireDocs(){$('#dcAdd').onclick=()=>{const l=$('#dcLabel').value.trim();if(!l)return;newDocs.push({label:l,val:$('#dcVal').value.trim()});$('#dcLabel').value='';$('#dcVal').value='';paintDocs();};}
function fgroup(label,inner){return `<div class="form-group"><div class="fg-h">${label}</div>${inner}</div>`;}
function riskSelect(idp){return `<select id="${idp}"><option value="faible">Faible</option><option value="modere" selected>Modéré</option><option value="eleve">Élevé</option></select>`;}

/* ===================== TOASTS ===================== */
function toast(msg){const e=document.createElement('div');e.className='toast';e.innerHTML=`<span class="ti">✓</span>${esc(msg)}`;$('#toastWrap').appendChild(e);setTimeout(()=>{e.style.opacity=0;e.style.transform='translateY(8px)';e.style.transition='.3s';setTimeout(()=>e.remove(),300);},2500);}
function gtoast(msg){const e=document.createElement('div');e.className='toast g';e.innerHTML=`${gFull()}${esc(msg)}`;$('#toastWrap').appendChild(e);setTimeout(()=>{e.style.opacity=0;e.style.transform='translateY(8px)';e.style.transition='.3s';setTimeout(()=>e.remove(),300);},2800);}

/* ===================== EVENTS / INIT ===================== */
document.addEventListener('click',e=>{const n=e.target.closest('[data-mod]');if(n){setModule(n.dataset.mod);document.querySelector('.sidebar').classList.remove('mobile-open');$('#navScrim').classList.remove('open');}
  const cm=$('#createMenu');if(cm&&cm.classList.contains('open')&&!e.target.closest('.create-wrap'))cm.classList.remove('open');});
$('#scrim').onclick=closeDrawer;
$('#modalPos').onclick=e=>{if(e.target.id==='modalPos')closeModal();};
$('#gsearch').oninput=e=>{const q=e.target.value;if(state.module!=='tasks'){setModule('tasks');}
  if(!state.kf)state.kf={types:new Set(['programme','projet','activite','tache']),group:'statut',prog:'',who:'',q:'',view:'board'};
  state.kf.q=q;renderKanban();const f=$('#kfQ');if(f){f.focus();f.value=q;}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#taskFull').classList.contains('open'))closeTaskFull();else if($('#modalPos').classList.contains('open'))closeModal();else closeDrawer();}});
function firstName(id){return aName(id).split(' ')[0];}
/* ===================== CENTRE D'ALERTES ===================== */
function alertScopeTask(t){const r=meRole();if(isFull())return true;const pid=(progOfTask(t)||{}).id;
  if(r==='dir_prog')return pid===myProg();
  if(r==='chef_projet')return (projOfTask(t)||{}).id===myProj()||t.assignee===ME;
  return t.assignee===ME;}
function computeAlerts(){const A=[];const ts=TACHES.filter(alertScopeTask);
  ts.filter(t=>isLate(t)).forEach(t=>A.push({sev:'high',cat:'En retard',ic:'⚠',title:t.title,sub:`${t.id} · échéance ${dShort(t.due)} · ${firstName(t.assignee)}`,ref:'task:'+t.id}));
  ts.filter(t=>t.obstacles).forEach(t=>A.push({sev:'high',cat:'Obstacle',ic:'⛔',title:t.title,sub:`${t.id} · ${t.obstacles.slice(0,70)}`,ref:'task:'+t.id}));
  ts.filter(t=>t.status==='done'&&!t.valide).forEach(t=>A.push({sev:'med',cat:'À valider',ic:'✓',title:t.title,sub:`${t.id} · terminée, en attente de validation`,ref:'task:'+t.id}));
  ts.filter(t=>!isLate(t)&&t.status!=='done'&&daysTo(t.due)!=null&&daysTo(t.due)>=0&&daysTo(t.due)<=3).forEach(t=>A.push({sev:'low',cat:'Échéance proche',ic:'⏳',title:t.title,sub:`${t.id} · ${daysTo(t.due)===0?"aujourd'hui":'dans '+daysTo(t.due)+' j'} · ${firstName(t.assignee)}`,ref:'task:'+t.id}));
  if(canSeeBudget()){const prjs=isFull()?PROJETS:meRole()==='dir_prog'?projsOfProg(myProg()):meRole()==='chef_projet'?PROJETS.filter(p=>p.id===myProj()):[];
    prjs.forEach(pr=>{const a=projAgg(pr.id);const tx=a.al?a.co/a.al:0;if(tx>0.9)A.push({sev:'high',cat:'Budget',ic:'₣',title:pr.name,sub:`${Math.round(tx*100)}% décaissé — risque de dépassement`,ref:'module:budget'});});}
  if(canSeeModule('workload')){const w=WEEKS[2];AGENTS.filter(a=>isFull()||a.prog===myProg()).forEach(a=>{const load=allocAgentWeek(a.id,w);if(load>a.cap)A.push({sev:'med',cat:'Surcharge',ic:'👤',title:a.name,sub:`Surchargé·e cette semaine (${load}/${a.cap} j)`,ref:'module:plan'});});}
  const order={high:0,med:1,low:2};return A.sort((x,y)=>order[x.sev]-order[y.sev]);}
const ALERT_CATS=['En retard','Obstacle','À valider','Échéance proche','Budget','Surcharge'];
function alertPrefs(){if(!state.alertPrefs){state.alertPrefs={};ALERT_CATS.forEach(c=>state.alertPrefs[c]=1);}return state.alertPrefs;}
function activeAlerts(){const pr=alertPrefs();return computeAlerts().filter(a=>pr[a.cat]!==0);}
function renderBell(){const A=activeAlerts();const hi=A.filter(a=>a.sev==='high').length;const bd=$('#bellBadge');if(!bd)return;
  if(A.length){bd.textContent=A.length>9?'9+':A.length;bd.className='bell-badge '+(hi?'high':'med');}else{bd.textContent='';bd.className='bell-badge';}}
function toggleAlertPanel(){const p=$('#alertPanel');if(p.classList.contains('open')){p.classList.remove('open');return;}
  const A=activeAlerts();const pr=alertPrefs();
  const counts={};A.forEach(a=>counts[a.cat]=(counts[a.cat]||0)+1);
  const digestParts=['En retard','À valider','Échéance proche','Budget'].filter(c=>counts[c]).map(c=>`${counts[c]} ${c.toLowerCase()}`);
  const digest=digestParts.length?digestParts.join(' · '):'rien à signaler';
  p.innerHTML=`<div class="ap-h"><div><b>Alertes</b><div class="ap-digest">Aujourd'hui : ${digest}</div></div><button class="ap-gear" id="apGear" title="Préférences">⚙</button></div>
  <div class="ap-prefs" id="apPrefs">${ALERT_CATS.map(c=>`<label class="ap-pref"><input type="checkbox" data-apc="${c}" ${pr[c]!==0?'checked':''}><span>${c}</span></label>`).join('')}</div>
  <div class="ap-body">${A.length?A.map(a=>`<button class="ap-item ${a.sev}" data-aref="${a.ref}"><span class="ap-ic">${a.ic}</span><div class="ap-m"><div class="ap-t">${esc(a.title)}</div><div class="ap-s">${esc(a.sub)}</div></div><span class="ap-cat">${a.cat}</span></button>`).join(''):'<div class="ap-empty"><div style="font-size:26px">✓</div>Aucune alerte. Tout est sous contrôle.</div>'}</div>`;
  p.classList.add('open');
  $('#apGear').onclick=e=>{e.stopPropagation();$('#apPrefs').classList.toggle('open');};
  $$('#apPrefs [data-apc]').forEach(c=>c.onchange=()=>{pr[c.dataset.apc]=c.checked?1:0;renderBell();});
  $$('#alertPanel [data-aref]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.aref.split(':');p.classList.remove('open');if(k==='task')openTaskDrawer(v);else setModule(v);});}
function renderMe(){const a=agent(ME);const def=ROLE_DEFS[a.roleType]||ROLE_DEFS.collaborateur;
  $('#sbFoot').innerHTML=`<div class="me-av" style="background:${a.color}">${ini(a.name)}</div><div class="me-id"><b>${esc(a.name)}</b><span>${esc(a.role)}</span></div><span class="role-badge">${def.tag}</span><button class="me-switch" id="meSwitch" title="Changer d'utilisateur"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg></button>
    <div class="me-menu" id="meMenu"><div class="mm-h">Changer de profil — chaque rôle a sa vue</div>${AGENTS.map(x=>{const d=ROLE_DEFS[x.roleType]||ROLE_DEFS.collaborateur;return `<button data-su="${x.id}" class="${x.id===ME?'on':''}"><span class="ava sm" style="background:${x.color}">${ini(x.name)}</span><div class="mm-id"><b>${esc(x.name)}</b><span>${esc(x.role)}</span></div><span class="mm-tag">${d.tag}</span></button>`;}).join('')}<div class="mm-sep"></div><button class="mm-act" id="mmJournal"><span class="mm-ico">🕑</span>Journal d'activité</button><button class="mm-act danger" id="mmReset"><span class="mm-ico">↺</span>Réinitialiser la démo</button></div>`;
  $('#meSwitch').onclick=e=>{e.stopPropagation();$('#meMenu').classList.toggle('open');};
  $$('#meMenu [data-su]').forEach(b=>b.onclick=()=>{ME=b.dataset.su;$('#meMenu').classList.remove('open');renderMe();setModule(state.module);gtoast('Connecté·e : '+aName(ME)+' — '+meDef().label);});
  $('#mmJournal').onclick=()=>{$('#meMenu').classList.remove('open');openJournal();};
  $('#mmReset').onclick=()=>{$('#meMenu').classList.remove('open');if(confirm('Réinitialiser toutes les données de démonstration ? Les modifications enregistrées seront effacées.'))resetData();};}
document.addEventListener('click',e=>{const mm=$('#meMenu');if(mm&&mm.classList.contains('open')&&!e.target.closest('#sbFoot'))mm.classList.remove('open');
  const ap=$('#alertPanel');if(ap&&ap.classList.contains('open')&&!e.target.closest('.tb-alert'))ap.classList.remove('open');});
$('#tbBell').onclick=e=>{e.stopPropagation();toggleAlertPanel();};
$('#hamburger').onclick=()=>{document.querySelector('.sidebar').classList.toggle('mobile-open');$('#navScrim').classList.toggle('open');};
$('#navScrim').onclick=()=>{document.querySelector('.sidebar').classList.remove('mobile-open');$('#navScrim').classList.remove('open');};
restore();enrichActs();renderMe();renderNav();setModule('overview');renderBell();
window.addEventListener('beforeunload',persist);setInterval(persist,2500);

</script>
