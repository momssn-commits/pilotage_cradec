<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CRADESC — Tableau de bord direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{
  --acajou:#4A2E25;--acajou-d:#3A241D;--acajou-l:#5E3D31;
  --taupe:#7A6962;--taupe-2:#A2948D;
  --paper:#F4F0EB;--surface:#FFFFFF;--surface-2:#FBF8F4;
  --parch:#EBE1D6;--parch-2:#C9BCAF;
  --line:#E7DED4;--line-2:#F0E9E0;
  --ink:#2A2018;--ink-soft:#6B5D52;--ink-faint:#9A8C7F;
  --green:#4E6B52;--green-bg:#EAF0EA;--green-line:#CFE0D0;
  --ocre:#9A6B22;--ocre-bg:#F7EFE0;
  --oxblood:#9B3B2E;--oxblood-bg:#F6E8E4;
  --slate:#5E5A74;--slate-bg:#ECEBF1;
  --blue:#3a5a78;--blue-bg:#E8EEF3;
  --accent:#BE7B57;
  --shadow:0 1px 2px rgba(74,46,37,.04),0 2px 8px rgba(74,46,37,.05);
  --shadow-lg:0 12px 40px rgba(74,46,37,.16);
  --r:14px;
  --sans:'Inter',system-ui,sans-serif;--serif:'Spectral',Georgia,serif;--mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.faint{color:var(--ink-faint)}

.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sidebar{background:var(--acajou-d);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px}
.sb-logo{width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.sb-logo img{width:34px;height:34px;object-fit:contain}
.sb-brand b{font-size:16px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.sb-brand span{font-size:10px;letter-spacing:.15em;color:rgba(255,255,255,.5)}
.sb-nav{flex:1;overflow-y:auto;padding:8px 12px}
.nav-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.32);padding:16px 12px 6px}
.navit{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#d8c9bf;font-size:13.5px;font-weight:500;width:100%;text-align:left;transition:.12s}
.navit:hover{background:rgba(255,255,255,.06);color:#fff}
.navit.on{background:var(--acajou-l);color:#fff}
.navit svg{width:18px;height:18px;flex:none}
.navit .nb{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 7px;min-width:18px;text-align:center}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.me-menu{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;width:100%;text-align:left}
.me-menu:hover{background:rgba(255,255,255,.06)}
.me-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.me-menu b{font-size:13px;font-weight:600;color:#fff;display:block;line-height:1.2}
.me-menu span{font-size:11px;color:rgba(255,255,255,.55)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:15px 28px;background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tb-t h1{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}
.tb-t p{font-size:12.5px;color:var(--ink-faint)}
.tb-spacer{flex:1}
.tb-search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;color:var(--ink-faint);width:240px}
.tb-search input{flex:1;border:none;outline:none;background:none;font-size:13.5px;color:var(--ink)}
.btn-primary{display:flex;align-items:center;gap:8px;background:var(--acajou);color:#fff;border-radius:11px;padding:11px 17px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--acajou-d)}
.btn-ghost{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--taupe-2);color:var(--acajou)}

.view{flex:1;padding:26px 30px 60px;max-width:1320px;width:100%;margin:0 auto}
.page-head{margin-bottom:22px}
.page-head h2{font-family:var(--serif);font-size:25px;font-weight:600}
.page-head p{font-size:14px;color:var(--ink-soft);margin-top:4px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:17px 19px}
.kpi-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi-l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.kpi-ic{width:33px;height:33px;border-radius:9px;display:grid;place-items:center}
.kpi-n{font-size:30px;font-weight:700;line-height:1;font-family:var(--serif)}
.kpi-s{font-size:12px;color:var(--ink-faint);margin-top:7px}

.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.panel-h h3{font-family:var(--serif);font-size:16px;font-weight:600}
.panel-b{padding:8px 20px 14px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.ocre{background:var(--ocre-bg);color:var(--ocre)}
.pill.ox{background:var(--oxblood-bg);color:var(--oxblood)}
.pill.slate{background:var(--slate-bg);color:var(--slate)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:11px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:.1s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{font-family:var(--mono);text-align:right;white-space:nowrap}
.req-id{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-weight:600}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10.5px;font-weight:600;vertical-align:middle}
.cellwho{display:flex;align-items:center;gap:8px}

.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--surface);color:var(--acajou);box-shadow:var(--shadow)}

/* mini circuit progress in table */
.circ-mini{display:flex;align-items:center;gap:4px}
.circ-dot{width:8px;height:8px;border-radius:50%;background:var(--parch-2)}
.circ-dot.ok{background:var(--green)}
.circ-dot.cur{background:var(--ocre);box-shadow:0 0 0 3px var(--ocre-bg)}
.circ-dot.no{background:var(--oxblood)}

/* budget bar */
.bbar{height:9px;border-radius:6px;background:var(--parch);overflow:hidden}
.bbar i{display:block;height:100%;border-radius:6px}
.budg-row{padding:12px 0;border-bottom:1px solid var(--line-2)}
.budg-row:last-child{border-bottom:none}
.budg-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:13px}
.budg-top b{font-weight:600}
.budg-meta{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);margin-top:5px}

/* queue cards (validations) */
.qcard{display:flex;align-items:center;gap:16px;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px}
.qcard .q-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--ocre-bg);color:var(--ocre);flex:none}
.qcard .q-m{flex:1;min-width:0}
.qcard .q-t{font-size:14.5px;font-weight:600}
.qcard .q-s{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.qcard .q-amt{font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
.qcard .q-acts{display:flex;gap:7px;flex:none}
.btn-ok{display:flex;align-items:center;gap:6px;background:var(--green);color:#fff;border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600}
.btn-ok:hover{filter:brightness(1.06)}
.btn-no{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--oxblood);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600}
.btn-no:hover{background:var(--oxblood-bg);border-color:var(--oxblood)}
.empty{text-align:center;padding:46px 20px;color:var(--ink-faint)}
.empty .e-ic{width:54px;height:54px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--taupe-2)}
.empty b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px}

/* fournisseurs */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.fcard-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fcard-ic{width:42px;height:42px;border-radius:11px;background:var(--parch);display:grid;place-items:center;color:var(--acajou);font-weight:700;font-family:var(--serif);flex:none}
.fcard b{font-size:14.5px;font-weight:600}
.fcard .fc-cat{font-size:12px;color:var(--ink-faint)}
.fcard-meta{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.fcard-meta .fm{display:flex;justify-content:space-between;gap:10px}
.stars{color:var(--ocre);font-size:12px}

/* policy */
.policy-step{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line-2)}
.policy-step:last-child{border-bottom:none}
.ps-amt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--acajou);width:190px;flex:none}
.ps-chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ps-node{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600}
.ps-arrow{color:var(--taupe-2)}

/* DRAWER */
.scrim{position:fixed;inset:0;background:rgba(40,28,22,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:94vw;background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s;z-index:50;overflow-y:auto}
.drawer.open{transform:none}
.dw-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dw-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dw-key{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.dw-x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-soft)}
.dw-x:hover{background:var(--surface-2);color:var(--acajou)}
.dw-title{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:12px;line-height:1.25}
.dw-sub{font-size:12.5px;color:var(--ink-faint);margin-top:5px}
.dw-body{padding:18px 24px 40px}
.section{padding:16px 0;border-bottom:1px solid var(--line-2)}
.section:last-child{border-bottom:none}
.sec-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px}
.kv .k{color:var(--ink-soft)}
.kv .v{font-weight:500;text-align:right}

/* budget control widget */
.budgctl{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.budgctl.ok{border-color:var(--green-line);background:var(--green-bg)}
.budgctl.no{border-color:#e7c9c2;background:var(--oxblood-bg)}
.bc-top{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;margin-bottom:9px}
.bc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px}
.bc-grid .bcg b{font-family:var(--mono);display:block;font-size:13.5px}
.bc-grid .bcg span{color:var(--ink-soft);font-size:11px}

/* lignes table */
.lignes{width:100%;border-collapse:collapse;font-size:13px}
.lignes th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:7px 8px;border-bottom:1px solid var(--line)}
.lignes td{padding:9px 8px;border-bottom:1px solid var(--line-2)}
.lignes .num{font-family:var(--mono);text-align:right;white-space:nowrap}
.lignes tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;padding-top:11px}

/* circuit stepper */
.stepper{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:14px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.step.done:not(:last-child)::before{background:var(--green-line)}
.step-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:14px;z-index:1;border:2px solid var(--line);background:var(--surface);color:var(--ink-faint)}
.step.done .step-ic{background:var(--green);border-color:var(--green);color:#fff}
.step.cur .step-ic{background:var(--ocre);border-color:var(--ocre);color:#fff}
.step.no .step-ic{background:var(--oxblood);border-color:var(--oxblood);color:#fff}
.step-m{flex:1;min-width:0;padding-top:3px}
.step-t{font-size:13.5px;font-weight:600}
.step-s{font-size:12px;color:var(--ink-faint);margin-top:2px}
.step-c{font-size:12px;color:var(--ink-soft);margin-top:5px;background:var(--surface-2);border-radius:8px;padding:7px 10px;border:1px solid var(--line-2)}
.step.warn .step-c{background:var(--ocre-bg);border-color:#ecdcc0;color:var(--ocre)}

.dw-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.act-approve{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;border-radius:11px;padding:13px;font-size:14px;font-weight:600}
.act-approve:hover{filter:brightness(1.06)}
.act-reject{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--oxblood);border-radius:11px;padding:13px 18px;font-size:14px;font-weight:600}
.act-reject:hover{background:var(--oxblood-bg);border-color:var(--oxblood)}
.act-bc{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acajou);color:#fff;border-radius:11px;padding:13px;font-size:14px;font-weight:600}
.act-bc:hover{background:var(--acajou-d)}
.cmt-box{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-family:var(--sans);resize:vertical;min-height:60px;margin-bottom:10px}
.cmt-box:focus{outline:none;border-color:var(--acajou);box-shadow:0 0 0 3px var(--parch)}

/* MODAL */
.modal-pos{position:fixed;inset:0;background:rgba(40,28,22,.46);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:60;overflow-y:auto}
.modal-pos.open{display:flex}
.modal{width:100%;max-width:680px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal-h{padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h2{font-family:var(--serif);font-size:20px;font-weight:600}
.modal-h p{font-size:13px;color:var(--ink-faint);margin-top:3px}
.modal-b{padding:20px 24px;max-height:62vh;overflow-y:auto}
.modal-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--surface);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--acajou);box-shadow:0 0 0 3px var(--parch)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-cancel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.btn-save{background:var(--acajou);color:#fff;border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:600}
.btn-save:hover{background:var(--acajou-d)}
.lrow{display:grid;grid-template-columns:1fr 70px 110px 110px 30px;gap:8px;align-items:center;margin-bottom:8px}
.lrow input{padding:8px 10px;font-size:13px}
.lrow .lr-rm{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--oxblood)}
.lrow .lr-rm:hover{background:var(--oxblood-bg)}
.lrow-h{display:grid;grid-template-columns:1fr 70px 110px 110px 30px;gap:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:6px;padding:0 2px}
.add-line{display:flex;align-items:center;gap:7px;color:var(--acajou);font-size:13px;font-weight:600;padding:8px 0;margin-top:4px}
.modal-total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:2px solid var(--line);font-size:15px}
.modal-total b{font-family:var(--mono);font-size:18px}

/* toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--acajou-d);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* recent activity */
.act-i{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.act-i:last-child{border-bottom:none}
.act-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;flex:none}
.act-m{flex:1;font-size:13px;line-height:1.5}
.act-m b{font-weight:600}
.act-time{font-size:11px;color:var(--ink-faint);font-family:var(--mono);flex:none}

@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{display:none}.kpis{grid-template-columns:1fr}.lrow,.lrow-h{grid-template-columns:1fr 50px 90px 30px}.lrow .lr-pu{display:none}.lrow-h span:nth-child(4){display:none}}

/* ===== cycle de vie (macro-stepper) ===== */
.cycle{display:flex;align-items:flex-start;margin:4px 0 2px}
.cyc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.cyc:not(:last-child)::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
.cyc.done:not(:last-child)::after{background:var(--green-line)}
.cyc-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--ink-faint);z-index:1}
.cyc.done .cyc-dot{background:var(--green);border-color:var(--green);color:#fff}
.cyc.cur .cyc-dot{background:var(--ocre);border-color:var(--ocre);color:#fff;box-shadow:0 0 0 4px var(--ocre-bg)}
.cyc.no .cyc-dot{background:var(--oxblood);border-color:var(--oxblood);color:#fff}
.cyc-l{font-size:9.5px;color:var(--ink-soft);line-height:1.2;max-width:62px;font-weight:500}
.cyc.cur .cyc-l{color:var(--ocre);font-weight:700}
.cyc.done .cyc-l{color:var(--ink)}
.bc-sec{background:var(--surface-2);margin:0 -24px;padding:16px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* ===== impression du bon de commande ===== */
#printArea{display:none}
@media print{
 body.printing>*:not(#printArea){display:none!important}
 body.printing #printArea{display:block!important}
 @page{margin:18mm}
}
.pr-doc{font-family:var(--sans);color:#1a1a1a;max-width:760px;margin:0 auto;padding:10px}
.pr-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--acajou);padding-bottom:16px;margin-bottom:22px}
.pr-org{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--acajou);letter-spacing:.02em}
.pr-subt{font-size:12px;color:#555;margin-top:3px}
.pr-bc{text-align:right;font-size:11px;letter-spacing:.1em;color:#555;line-height:1.5}
.pr-id{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--acajou);letter-spacing:0}
.pr-meta{display:flex;justify-content:space-between;gap:30px;font-size:13px;line-height:1.6;margin-bottom:22px}
.pr-lab{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--acajou);font-weight:700;margin-bottom:4px}
.pr-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px}
.pr-tbl th{text-align:left;background:var(--acajou);color:#fff;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.pr-tbl th:not(:first-child),.pr-tbl td:not(:first-child){text-align:right;font-family:var(--mono)}
.pr-tbl td{padding:9px 12px;border-bottom:1px solid #e3dccf}
.pr-tbl tfoot td{font-weight:700;border-top:2px solid var(--acajou);border-bottom:none;font-size:14px;padding-top:11px}
.pr-obj{font-size:13px;margin-bottom:34px}
.pr-sign{display:flex;justify-content:space-between;gap:40px;margin-top:30px}
.pr-sg{flex:1;font-size:12px;color:#555}
.pr-sg span{display:block;border-top:1px solid #999;margin-top:46px}

/* ===== pièces jointes & devis ===== */
.pieces{display:flex;flex-direction:column;gap:6px}
.piece{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px}
.piece .pc-ic{color:var(--taupe);display:grid}
.piece .pc-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.piece .pc-s{color:var(--ink-faint);font-size:11px;font-family:var(--mono)}
.dv-ret{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);white-space:nowrap;justify-self:center}
.dv-ret input{width:auto;margin:0}
.bclink{cursor:pointer;text-decoration:underline}

/* ===== tableau de bord direction ===== */
.per-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-family:var(--mono)}
.dom-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.dom-card .dom-h{display:flex;align-items:center;gap:10px;padding:14px 16px 11px;border-bottom:1px solid var(--line)}
.dom-card .dom-h b{font-family:var(--serif);font-size:14.5px;flex:1}
.dom-ic{width:30px;height:30px;border-radius:9px;color:#fff;display:grid;place-items:center}
.dom-open{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);display:grid;place-items:center;cursor:pointer}
.dom-open:hover{background:var(--surface-2);color:var(--acajou)}
.dc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line-2)}
.dc-row:last-child{border-bottom:none}.dc-row span{color:var(--ink-soft)}.dc-row b{font-weight:600}.dc-row.warn b{color:var(--oxblood)}
.dec-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-2)}
.dec-row:last-child{border-bottom:none}
.dec-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.dec-m{flex:1;min-width:0}.dec-t{font-weight:600;font-size:13.5px}.dec-s{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.dec-amt{font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}
.dec-open{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.dec-open:hover{background:var(--surface-2);color:var(--acajou)}
.stackbar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--parch);gap:1px}
.stackbar i{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
@media(max-width:900px){.dom-grid{grid-template-columns:1fr}}

/* ---------- agrégations ---------- */
let HUB_ENG=null;
function engByProg(progId){
 if(HUB_ENG){const a=(HUB_ENG.achats||{})[progId]||0,p=(HUB_ENG.paiements||{})[progId]||0,m=(HUB_ENG.missions||{})[progId]||0;return {achats:a,paiements:p,missions:m,total:a+p+m};}
 const a=ACHATS.filter(r=>r.prog===progId&&achatsEngaged(r)).reduce((s,r)=>s+r.montant,0);
 const p=PAIEMENTS.filter(d=>d.prog===progId&&paieEngaged(d)).reduce((s,d)=>s+d.montant,0);
 const m=MISSIONS.filter(o=>o.prog===progId&&missEngaged(o)).reduce((s,o)=>s+o.montant,0);
 return {achats:a,paiements:p,missions:m,total:a+p+m};}
function dirPending(){
 const list=[];
 ACHATS.filter(r=>r.status==='validation'&&r.etape==='Direction').forEach(r=>list.push({...r,dom:'achats'}));
 PAIEMENTS.filter(d=>d.status==='validation'&&d.etape==='Direction').forEach(d=>list.push({...d,dom:'paiements'}));
 MISSIONS.filter(o=>o.status==='validation'&&o.etape==='Direction').forEach(o=>list.push({...o,dom:'missions'}));
 return list;}
function aDecaisser(){return PAIEMENTS.filter(paieADecaisser).reduce((s,d)=>s+d.montant,0);}
function decaisse(){return PAIEMENTS.filter(d=>d.status==='payee').reduce((s,d)=>s+d.montant,0);}
function depassements(){return PROGRAMMES.filter(p=>{const e=engByProg(p.id).total;return p.conso+e>p.budget;}).length;}

}
function renderNav(){$('#nav').innerHTML=NAV.map(([k,l,ic])=>{const n=k==='decisions'?dirPending().length:0;return `<button class="navit ${state.module===k?'on':''}" data-nav="${k}">${svg(ic)}<span>${l}</span>${n?`<span class="nb">${n}</span>`:''}</button>`;}).join('');
 $$('#nav [data-nav]').forEach(b=>b.onclick=()=>{state.module=b.dataset.nav;render();renderNav();});}
function render(){const t=TITLES[state.module];$('#pgTitle').textContent=t[0];$('#pgSub').textContent=t[1];
 ({synth:renderSynth,budget:renderBudget,decisions:renderDecisions,perf:renderPerf}[state.module]||renderSynth)($('#view'));}
function kpiBox(l,n,s,ic,c,bg){return `<div class="kpi"><div class="kpi-h"><span class="kpi-l">${l}</span><span class="kpi-ic" style="background:${bg};color:${c}">${svg(ic,17)}</span></div><div class="kpi-n">${n}</div><div class="kpi-s">${s}</div></div>`;}

function domEng(dom){if(HUB_ENG&&HUB_ENG[dom])return Object.values(HUB_ENG[dom]).reduce((s,v)=>s+v,0);return null;}
function domainCard(dk){const d=DOMAINS[dk];let body='';
 if(dk==='achats'){const enCours=ACHATS.filter(r=>r.status==='validation').length;const bc=ACHATS.filter(r=>['bc'].includes(r.status)).length;const eng=domEng('achats')!=null?domEng('achats'):ACHATS.filter(achatsEngaged).reduce((s,r)=>s+r.montant,0);
   body=`<div class="dc-row"><span>Réquisitions en validation</span><b>${enCours}</b></div><div class="dc-row"><span>Bons de commande actifs</span><b>${bc}</b></div><div class="dc-row warn"><span>Livraisons en retard</span><b>${BONS_RETARD}</b></div><div class="dc-row"><span>Engagé</span><b class="mono">${fcfa(eng)}</b></div>`;}
 if(dk==='paiements'){const enVal=PAIEMENTS.filter(p=>p.status==='validation').length;const dec=PAIEMENTS.filter(paieADecaisser).length;const eng=domEng('paiements')!=null?domEng('paiements'):PAIEMENTS.filter(paieEngaged).reduce((s,p)=>s+p.montant,0);
   body=`<div class="dc-row"><span>En validation</span><b>${enVal}</b></div><div class="dc-row"><span>À décaisser</span><b>${dec}</b></div><div class="dc-row"><span>Décaissé</span><b class="mono">${fcfa(decaisse())}</b></div><div class="dc-row"><span>Engagé</span><b class="mono">${fcfa(eng)}</b></div>`;}
 if(dk==='missions'){const enVal=MISSIONS.filter(o=>o.status==='validation').length;const enMiss=MISSIONS.filter(o=>o.status==='avance').length;const rap=MISSIONS.filter(o=>o.status==='rapport').length;const eng=domEng('missions')!=null?domEng('missions'):MISSIONS.filter(missEngaged).reduce((s,o)=>s+o.montant,0);
   body=`<div class="dc-row"><span>En validation</span><b>${enVal}</b></div><div class="dc-row"><span>En mission</span><b>${enMiss}</b></div><div class="dc-row"><span>Rapports à valider</span><b>${rap}</b></div><div class="dc-row"><span>Engagé</span><b class="mono">${fcfa(eng)}</b></div>`;}
 return `<div class="panel dom-card"><div class="dom-h" style="--dc:${d.col}"><span class="dom-ic" style="background:${d.col}">${svg(d.ic,16)}</span><b>${d.label}</b><button class="dom-open" data-open="${d.app}" title="Ouvrir la plateforme">${svg(IC.ext,15)}</button></div><div class="panel-b">${body}</div></div>`;}

function renderSynth(v){
 const pend=dirPending();const totalBudget=PROGRAMMES.reduce((s,p)=>s+p.budget,0);
 const totalEng=PROGRAMMES.reduce((s,p)=>s+p.conso+engByProg(p.id).total,0);
 const pctGlob=Math.round(totalEng/totalBudget*100);
 const echeances=[...PAIEMENTS.filter(d=>['approuvee','ordonnance'].includes(d.status)).map(d=>({t:'Paiement',label:d.objet,date:'—',col:'#C0395F',montant:d.montant})),
   ...MISSIONS.filter(o=>o.depart&&o.depart>=TODAY&&!['rejetee'].includes(o.status)).map(o=>({t:'Départ mission',label:o.objet,date:o.depart,col:'#3a8fb7',montant:o.montant}))]
   .sort((a,b)=>(a.date||'9').localeCompare(b.date||'9')).slice(0,5);
 v.innerHTML=`<div class="kpis">
   ${kpiBox('Décisions en attente',pend.length,'À arbitrer par la direction',IC.check,'var(--ocre)','var(--ocre-bg)')}
   ${kpiBox('Engagement global',pctGlob+' %',fcfa(totalEng)+' / '+fM(totalBudget),IC.budget,'var(--blue)','var(--blue-bg)')}
   ${kpiBox('Trésorerie à décaisser',fM(aDecaisser()),'Paiements approuvés',IC.wallet,'var(--slate)','var(--slate-bg)')}
   ${kpiBox('Alertes',BONS_RETARD+depassements(),'Retards + dépassements',IC.alert,'var(--oxblood)','var(--oxblood-bg)')}
 </div>
 <div class="dom-grid">${Object.keys(DOMAINS).map(domainCard).join('')}</div>
 <div class="grid2" style="margin-top:4px"><div>
   <div class="panel"><div class="panel-h"><h3>Décisions en attente</h3>${pend.length?`<button class="btn-ghost" data-go="decisions">Tout voir</button>`:''}</div><div class="panel-b">${pend.length?pend.slice(0,5).map(decRow).join(''):`<div class="empty"><div class="e-ic">${svg(IC.check,24)}</div><b>Aucun arbitrage en attente</b></div>`}</div></div>
 </div><div>
   <div class="panel"><div class="panel-h"><h3>Engagement budgétaire par programme</h3></div><div class="panel-b">${PROGRAMMES.map(p=>{const e=engByProg(p.id).total;const used=p.conso+e;const pct=Math.min(100,Math.round(used/p.budget*100));const col=pct>90?'var(--oxblood)':pct>75?'var(--ocre)':'var(--green)';return `<div class="budg-row"><div class="budg-top"><b>${esc(p.name)}</b><span class="mono">${pct}%</span></div><div class="bbar"><i style="width:${pct}%;background:${col}"></i></div><div class="budg-meta">Disponible ${fcfa(p.budget-used)} · engagé ${fcfa(e)}</div></div>`;}).join('')}</div></div>
   <div class="panel"><div class="panel-h"><h3>Échéances à venir</h3></div><div class="panel-b">${echeances.length?echeances.map(e=>`<div class="act-i"><span class="act-av" style="background:${e.col}">${svg(e.t==='Paiement'?IC.pay:IC.plane,13)}</span><div class="act-m"><b>${esc(e.label)}</b><div class="faint" style="font-size:11.5px">${e.t} · ${e.date!=='—'?dLong(e.date):'à ordonnancer'} · ${fcfa(e.montant)}</div></div></div>`).join(''):'<div class="faint" style="padding:10px 0;font-size:13px">Aucune échéance.</div>'}</div></div>
 </div></div>`;
 $$('#view [data-go]').forEach(b=>b.onclick=()=>{state.module=b.dataset.go;render();renderNav();});
 $$('#view [data-open]').forEach(b=>b.onclick=()=>openPlatform(b.dataset.open));
 $$('#view [data-decopen]').forEach(b=>b.onclick=()=>openPlatform(b.dataset.decopen,b.dataset.ref));
}
function decRow(it){const d=DOMAINS[it.dom];return `<div class="dec-row"><span class="dec-ic" style="background:${d.col}1a;color:${d.col}">${svg(d.ic,15)}</span><div class="dec-m"><div class="dec-t">${esc(it.objet)}</div><div class="dec-s">${it.ref} · ${d.label} · ${esc(it.who||'')} · étape : ${it.etape}</div></div><div class="dec-amt">${fcfa(it.montant)}</div><button class="dec-open" data-decopen="${d.app}" data-ref="${it.ref}" title="Ouvrir le dossier">${svg(IC.ext,15)}</button></div>`;}

function renderBudget(v){
 const tB=PROGRAMMES.reduce((s,p)=>s+p.budget,0),tC=PROGRAMMES.reduce((s,p)=>s+p.conso,0);
 const tA=PROGRAMMES.reduce((s,p)=>s+engByProg(p.id).achats,0),tP=PROGRAMMES.reduce((s,p)=>s+engByProg(p.id).paiements,0),tM=PROGRAMMES.reduce((s,p)=>s+engByProg(p.id).missions,0);
 const tDispo=tB-tC-tA-tP-tM;
 v.innerHTML=`<div class="page-head"><p>Décomposition de l'exécution budgétaire : consommé (réalisé) + engagements en cours par domaine, et disponible résiduel.</p></div>
 <div class="panel"><table class="tbl"><thead><tr><th>Programme</th><th style="text-align:right">Budget</th><th style="text-align:right">Consommé</th><th style="text-align:right">Achats</th><th style="text-align:right">Paiements</th><th style="text-align:right">Missions</th><th style="text-align:right">Disponible</th><th>Exécution</th></tr></thead>
 <tbody>${PROGRAMMES.map(p=>{const e=engByProg(p.id);const used=p.conso+e.total;const dispo=p.budget-used;const pct=Math.min(100,Math.round(used/p.budget*100));const cpc=Math.round(p.conso/p.budget*100);
   return `<tr><td><b style="font-weight:600">${esc(p.name)}</b></td><td class="num">${fcfa(p.budget)}</td><td class="num">${fcfa(p.conso)}</td><td class="num">${e.achats?fcfa(e.achats):'—'}</td><td class="num">${e.paiements?fcfa(e.paiements):'—'}</td><td class="num">${e.missions?fcfa(e.missions):'—'}</td><td class="num" style="font-weight:700;color:${dispo<0?'var(--oxblood)':'var(--ink)'}">${fcfa(dispo)}</td>
   <td style="min-width:140px"><div class="stackbar"><i style="width:${cpc}%;background:var(--taupe)" title="Consommé"></i><i style="width:${Math.round(e.total/p.budget*100)}%;background:${pct>90?'var(--oxblood)':'var(--ocre)'}" title="Engagé"></i></div><div class="faint mono" style="font-size:10.5px;margin-top:3px">${pct}% engagé</div></td></tr>`;}).join('')}</tbody>
 <tfoot><tr><td>Total</td><td class="num">${fcfa(tB)}</td><td class="num">${fcfa(tC)}</td><td class="num">${fcfa(tA)}</td><td class="num">${fcfa(tP)}</td><td class="num">${fcfa(tM)}</td><td class="num" style="font-weight:700">${fcfa(tDispo)}</td><td></td></tr></tfoot></table></div>
 <div class="grid2"><div class="panel"><div class="panel-h"><h3>Répartition des engagements par domaine</h3></div><div class="panel-b">${[['Achats',tA,'#7C5CBF'],['Demandes de paiement',tP,'#C0395F'],['Ordres de mission',tM,'#3a8fb7']].map(([l,val,c])=>{const mx=Math.max(tA,tP,tM,1);return `<div class="budg-row"><div class="budg-top"><b>${l}</b><span class="mono">${fcfa(val)}</span></div><div class="bbar"><i style="width:${Math.round(val/mx*100)}%;background:${c}"></i></div></div>`;}).join('')}</div></div>
   <div class="panel"><div class="panel-h"><h3>Lecture</h3></div><div class="panel-b" style="padding:14px 20px 18px">
     <div class="kv"><span class="k">Engagement total</span><span class="v mono">${fcfa(tA+tP+tM)}</span></div>
     <div class="kv"><span class="k">Taux d'exécution global</span><span class="v mono">${Math.round((tC+tA+tP+tM)/tB*100)} %</span></div>
     <div class="kv"><span class="k">Disponible résiduel</span><span class="v mono" style="font-weight:700">${fcfa(tDispo)}</span></div>
     <div class="legend" style="margin-top:10px"><span><i style="background:var(--taupe)"></i>Consommé</span><span><i style="background:var(--ocre)"></i>Engagé (en cours)</span></div>
   </div></div></div>`;
}
function renderDecisions(v){const pend=dirPending();
 v.innerHTML=`<div class="page-head"><p>${pend.length?pend.length+' dossier(s) requièrent un arbitrage de la direction, tous workflows confondus. Ouvre la plateforme concernée pour décider.':'Aucun arbitrage de direction en attente.'}</p></div>
 ${pend.length?`<div class="panel"><div class="panel-b">${pend.map(decRow).join('')}</div></div>`:`<div class="empty"><div class="e-ic">${svg(IC.check,26)}</div><b>Tout est à jour</b></div>`}`;
 $$('#view [data-decopen]').forEach(b=>b.onclick=()=>openPlatform(b.dataset.decopen,b.dataset.ref));
}
function renderPerf(v){
 // indicateurs représentatifs consolidés
 const perf=[{dom:'achats',delai:3.4,resp:100},{dom:'paiements',delai:2.8,resp:100},{dom:'missions',delai:2.1,resp:100}];
 const tauxRapport=Math.round(MISSIONS.filter(o=>['rapport','cloturee'].includes(o.status)).length/Math.max(1,MISSIONS.filter(o=>['avance','rapport','cloturee'].includes(o.status)).length)*100);
 const delaiMoy=(perf.reduce((s,p)=>s+p.delai,0)/perf.length).toFixed(1);
 const respect=Math.round(perf.reduce((s,p)=>s+p.resp,0)/perf.length);
 v.innerHTML=`<div class="kpis">
   ${kpiBox('Délai moyen de validation',delaiMoy+' j','Tous workflows',IC.clock,'var(--blue)','var(--blue-bg)')}
   ${kpiBox('Respect budgétaire',respect+' %','Dossiers dans l\'enveloppe',IC.check,'var(--green)','var(--green-bg)')}
   ${kpiBox('Taux de rapport mission',tauxRapport+' %','Rapports soumis',IC.plane,'var(--ocre)','var(--ocre-bg)')}
   ${kpiBox('Décisions en attente',dirPending().length,'À arbitrer',IC.perf,'var(--slate)','var(--slate-bg)')}
 </div>
 <div class="panel"><div class="panel-h"><h3>Délai de validation par domaine</h3></div><div class="panel-b">${perf.map(p=>{const d=DOMAINS[p.dom];const mx=4;return `<div class="budg-row"><div class="budg-top"><b>${d.label}</b><span class="mono">${p.delai} j</span></div><div class="bbar"><i style="width:${Math.round(p.delai/mx*100)}%;background:${d.col}"></i></div></div>`;}).join('')}</div></div>
 <div class="grid2"><div class="panel"><div class="panel-h"><h3>Conformité budgétaire</h3></div><div class="panel-b">${perf.map(p=>{const d=DOMAINS[p.dom];return `<div class="budg-row"><div class="budg-top"><b>${d.label}</b><span class="mono">${p.resp}%</span></div><div class="bbar"><i style="width:${p.resp}%;background:var(--green)"></i></div></div>`;}).join('')}</div></div>
   <div class="panel"><div class="panel-h"><h3>Points de vigilance</h3></div><div class="panel-b">
     <div class="act-i"><span class="act-av" style="background:var(--oxblood)">${svg(IC.alert,13)}</span><div class="act-m"><b>${BONS_RETARD} livraison(s) en retard</b><div class="faint" style="font-size:11.5px">Bon de commande au-delà du délai — relance requise</div></div></div>
     <div class="act-i"><span class="act-av" style="background:var(--ocre)">${svg(IC.check,13)}</span><div class="act-m"><b>${dirPending().length} arbitrage(s) en attente</b><div class="faint" style="font-size:11.5px">Dossiers bloqués à l'étape direction</div></div></div>
     <div class="act-i"><span class="act-av" style="background:var(--slate)">${svg(IC.wallet,13)}</span><div class="act-m"><b>${fcfa(aDecaisser())} à décaisser</b><div class="faint" style="font-size:11.5px">Paiements approuvés en attente de trésorerie</div></div></div>
   </div></div></div>`;
}
function meMenu(){$('#modal')?null:0;const u=USERS;
 const html=`<div class="modal-h"><h2>Profil direction</h2><p>Vue réservée à la direction et l'administration.</p></div>
 <div class="modal-b">${Object.entries(u).map(([id,a])=>`<button class="qcard" data-me="${id}" style="width:100%;cursor:pointer;${id===ME?'border-color:var(--acajou)':''}"><span class="me-av" style="background:${a.color};width:40px;height:40px">${ini(a.name)}</span><div class="q-m"><div class="q-t">${esc(a.name)}</div><div class="q-s">${a.role}</div></div>${id===ME?'<span class="pill green">Actif</span>':''}</button>`).join('')}</div>
 <div class="modal-f"><button class="btn-cancel" id="mCancel">Fermer</button></div>`;
 $('#modal').innerHTML=html;$('#modalPos').classList.add('open');
 $('#mCancel').onclick=()=>$('#modalPos').classList.remove('open');
 $$('#modal [data-me]').forEach(b=>b.onclick=()=>{ME=b.dataset.me;$('#modalPos').classList.remove('open');renderApp();toast('Connecté·e : '+USERS[ME].name);});}

renderApp();

/* ---------- socle partagé : identité hub + budget consolidé ---------- */
function applyContext(msg){let ch=false;
 if(msg.session&&msg.session.agentId&&USERS[msg.session.agentId]){ME=msg.session.agentId;ch=true;}
 if(msg.engagements){HUB_ENG=msg.engagements;ch=true;}
 if(ch)renderApp();}
window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='cradesc-context')applyContext(d);});
try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'cradesc-ready',app:'direction'},'*');}catch(e){}
</script></body></html>
