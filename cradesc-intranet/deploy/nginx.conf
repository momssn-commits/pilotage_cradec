server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Type MIME correct pour les modules ES et le manifeste PWA.
  types {
    text/html                             html;
    application/javascript                js mjs;
    text/css                              css;
    image/svg+xml                         svg;
    application/manifest+json             webmanifest;
    image/png                             png;
  }

  # En-têtes de sécurité raisonnables (le front charge le SDK Firebase
  # depuis gstatic et appelle les API Google ; CSP volontairement non
  # restrictive ici — à durcir selon votre politique).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Le service worker ne doit pas être mis en cache agressivement.
  location = /service-worker.js { add_header Cache-Control "no-cache"; }

  # Application web : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
