# Déploiement derrière Traefik (serveur 187.124.52.164).
# Traefik tourne en réseau "host", provider Docker, entrypoints web/websecure,
# certresolver "letsencrypt" (challenge HTTP), redirection HTTP→HTTPS globale.
# On calque donc le schéma des services existants : réseau propre "_default"
# + label traefik.docker.network. Pas besoin de réseau Traefik partagé.
#
#   DOMAINE=intranet.sentch.org docker compose -p cradesc-intranet \
#     -f deploy/docker-compose.yml up -d --build
#
services:
  cradesc-intranet:
    build:
      context: ..                      # racine cradesc-intranet/ (pour copier hosting/)
      dockerfile: deploy/Dockerfile
    image: cradesc-intranet:latest
    container_name: cradesc-intranet-app
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Réseau par lequel Traefik joint ce conteneur (= <projet>_default).
      - "traefik.docker.network=${TRAEFIK_NETWORK:-cradesc-intranet_default}"
      # Routeur HTTPS (la redirection HTTP→HTTPS est gérée globalement par Traefik).
      - "traefik.http.routers.cradescintra.rule=Host(`${DOMAINE:-intranet.sentch.org}`)"
      - "traefik.http.routers.cradescintra.entrypoints=websecure"
      - "traefik.http.routers.cradescintra.tls=true"
      - "traefik.http.routers.cradescintra.tls.certresolver=${CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.cradescintra.loadbalancer.server.port=80"
